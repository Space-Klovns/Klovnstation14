
#### BASE KS14

# This is a base; gameplay-only changes that will be present on all KS14 builds (debug, release, etc.)

[ooc]
enable_during_round = true

[atmos]
# Bigger maxcap explo. range
max_explosion_range = 60

[pointing]
# Virtually nonexistent somethingburger
cooldown_seconds = 0.05

[shuttle]
emergency_early_launch_allowed = true

[explosion]
# This is how long (seconds) the VISUAL explosion effect stays for after an explosion is done exploding
persistence = 0.12

[klovn.jetpacks]
flyongrids = true

[klovn.ghostrespawn]
enabled = true
cooldown_seconds = 300
penalty_seconds = 180

[ghost]
# if in crit, do you immediately die when ghosting?
kill_crit = true

[control]
# up to 2 storage uis open at once
storage_limit = 2

[klovn.gun]
# originally 0.125
impulse_multiplier = 0.09375

# NPCs noticing targets by how well lit they are (targets in the dark go unseen unless close). On here; the
#   cvar itself defaults to off. It needs both of these: the server only keeps the light tree that light levels
#   are computed from if told to, and reads that setting at startup only. klovn.npc.light_detection can be
#   toggled live afterwards.
#   Cost is small - see KsCCVars.NpcLightDetection for measured figures.
[lookup]
enable_server_light_tree = true

[klovn.npc]
light_detection = true

# KS14: in-game voice chat. Off by default; see Klovn/Docs/voice_chat.md before enabling.
# Microphone pages need HTTPS, so public_url should point at a TLS reverse proxy in front of the status host.
#[klovn.voice]
#enabled = true
#public_url = "https://ks14.example.com"
