- type: constructionGraph
  id: APC
  start: start
  graph:
    - node: start
      edges:
        - to: apcFrame
          steps:
            - material: Steel
              amount: 3
              doAfter: 2

    - node: apcFrame
      entity: APCFrame
      edges:
        - to: apc
          steps:
            - component: ApcElectronics
              store: board # KS14: retain the installed electronics board
              name: construction-graph-component-apc-electronics
              icon:
                sprite: "Objects/Misc/module.rsi"
                state: "charger_APC"
              doAfter: 2
        - to: start
          completed:
            - !type:GivePrototype
              prototype: SheetSteel1
              amount: 3
            - !type:DeleteEntity {}
          steps:
            - tool: Screwing
              doAfter: 2

    - node: apc
      entity: APCConstructed
      edges:
        - to: apcFrame
          completed:
            # KS14 start: return the installed electronics board during deconstruction
            - !type:EmptyAllContainers
              pickup: true
              emptyAtUser: true
            # KS14 end
            - !type:RaiseEvent
              event: !type:APCDeconstructedEvent
              broadcast: false
          conditions:
            - !type:AllWiresCut # KS14: require all wires cut before deconstruction
            - !type:WirePanel
              open: true
          steps:
            - tool: Prying
              doAfter: 4

