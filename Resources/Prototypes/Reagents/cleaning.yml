- type: reagent
  id: Bleach
  name: reagent-name-bleach
  desc: reagent-desc-bleach
  physicalDesc: reagent-physical-desc-strong-smelling
  allowedJobs:
  - Janitor
  - Chemist
  flavor: bitter
  color: "#a1000b"
  boilingPoint: 384.15 # KS14: 111.0 -> 384.15, Kelvin
  meltingPoint: 268.15 # KS14: -5.0 -> 268.15, Kelvin
  metabolisms:
    Bloodstream:
      effects:
      - !type:HealthChange
        damage:
          types:
            Poison: 2
            Caustic: 2
      - !type:PopupMessage
        type: Local
        visualType: MediumCaution
        messages: [ "generic-reagent-effect-burning-insides" ]
        probability: 0.33
      - !type:Emote
        emote: Scream
        probability: 0.15
  tileReactions:
  - !type:CleanTileReaction
    cleanCost: 0.01
  - !type:CleanDecalsReaction
    cleanCost: 0.01

- type: reagent
  id: SpaceCleaner
  name: reagent-name-space-cleaner
  desc: reagent-desc-space-cleaner
  physicalDesc: reagent-physical-desc-lemony-fresh
  flavor: bitter
  color: "#c8ff69"
  recognizable: true
  boilingPoint: 420.15 # KS14: 147.0 -> 420.15, Kelvin. Made this up, loosely based on bleach
  meltingPoint: 262.15 # KS14: -11.0 -> 262.15, Kelvin
  tileReactions:
    - !type:CleanTileReaction
      cleanCost: 0.1
    - !type:CleanDecalsReaction
      cleanCost: 0.1

- type: reagent
  id: SoapReagent
  name: reagent-name-soap
  desc: reagent-desc-soap
  physicalDesc: reagent-physical-desc-soapy
  flavor: clean
  color: "#c8dfc9"
  recognizable: true
  boilingPoint: 373.15 # KS14: 100.0 -> 373.15, Kelvin
  meltingPoint: 333.15 # KS14: 60.0 -> 333.15, Kelvin
  slipData:
    requiredSlipSpeed: 3.5
  friction: 0.3 # Slightly less friction than water, but not as bad as space lube
  metabolisms:
    Digestion:
      effects:
      - !type:Vomit
        conditions:
        - !type:ReagentCondition
          reagent: SoapReagent
          min: 6
        probability: 0.20
      - !type:Vomit
        conditions:
        - !type:ReagentCondition
          reagent: SoapReagent
          min: 6
        probability: 0.20

- type: reagent
  id: SpaceLube
  name: reagent-name-space-lube
  desc: reagent-desc-space-lube
  evaporationSpeed: 0.1
  slipData:
    requiredSlipSpeed: 1
    superSlippery: true
  physicalDesc: reagent-physical-desc-shiny
  flavor: funny
  color: "#77b58e"
  recognizable: true
  boilingPoint: 563.15 # KS14: 290.0 -> 563.15, Kelvin. Glycerin
  meltingPoint: 291.35 # KS14: 18.2 -> 291.35, Kelvin
  tileReactions:
  - !type:SpillTileReaction
  friction: 0.05

- type: reagent
  id: SpaceGlue
  name: reagent-name-space-glue
  desc: reagent-desc-space-glue
  physicalDesc: reagent-physical-desc-sticky
  flavor: glue
  color: "#ffffff"
  boilingPoint: 523.15 # KS14: 250.0 -> 523.15, Kelvin
  meltingPoint: 653.15 # KS14: 380.0 -> 653.15, Kelvin
  tileReactions:
  - !type:SpillTileReaction
  viscosity: 0.5
  reactiveEffects:
    Acidic:
      methods: [ Touch ]
      effects:
      # pva glue? no, antibiotic glue for sealing wounds
      - !type:ModifyBleed
        amount: -1.5
  metabolisms:
    Bloodstream:
      effects:
      - !type:ModifyStatusEffect
        effectProto: StatusEffectSeeingRainbow
        time: 5
        type: Add
    Digestion:
      effects:
      - !type:GenericStatusEffect
        key: Muted
        component: Muted
        time: 5
  footstepSound:
    collection: FootstepSlime
