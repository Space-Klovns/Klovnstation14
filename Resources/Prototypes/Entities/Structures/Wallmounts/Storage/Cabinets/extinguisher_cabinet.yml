- type: entity
  parent: BaseWallmountCabinet
  id: ExtinguisherCabinet
  name: extinguisher cabinet
  description: A small wall mounted cabinet designed to hold a fire extinguisher.
  components:
    - type: Sprite
      sprite: _KS14/Structures/Wallmounts/extinguisher_cabinet.rsi # KS14: use KS sprites
      snapCardinals: true
      layers:
      # KS14: removed frame layer
      - state: extinguisher
        # KS14: removed mapping
        visible: true
    # KS14 start: specific sprites
      - map: [ exdefault ]
        state: extinguisher_default
        visible: false
      - map: [ exadvanced ]
        state: extinguisher_advanced
        visible: false
      - map: [ exmini ]
        state: extinguisher_mini
        visible: false
    # KS14 end
      - state: closed
        map: ["enum.OpenableVisuals.Layer"]
    # KS14 start: itemmapper for specific sprites
    - type: ItemMapper
      spriteLayers:
      - exdefault
      - exadvanced
      - exmini
      mapLayers:
        exdefault:
          whitelist:
            tags:
            - KsExtinguisherStandard
        exadvanced:
          whitelist:
            tags:
            - KsExtinguisherAdvanced
        exmini:
          whitelist:
            tags:
            - KsExtinguisherMini
    # KS14 end
    - type: ItemSlots
      slots:
        ItemCabinet:
          ejectOnInteract: true
          whitelist:
            components:
            - SpraySafety
    - type: Destructible
      thresholds:
        - trigger:
            !type:DamageTrigger
            damage: 80
          behaviors:
            - !type:DoActsBehavior
              acts: [ "Destruction" ]
        - trigger:
            !type:DamageTrigger
            damage: 40
          behaviors:
            - !type:EmptyAllContainersBehaviour
            - !type:DoActsBehavior
              acts: [ "Destruction" ]
            - !type:PlaySoundBehavior
              sound:
                collection: MetalGlassBreak
                params:
                  volume: -4

- type: entity
  parent: ExtinguisherCabinet
  id: ExtinguisherCabinetOpen
  suffix: Open
  components:
  - type: Openable
    opened: true

- type: entity
  parent: ExtinguisherCabinet
  id: ExtinguisherCabinetFilled
  suffix: Filled
  components:
  - type: ContainerFill
    containers:
      ItemCabinet:
      - FireExtinguisher

- type: entity
  parent: [ExtinguisherCabinetFilled, ExtinguisherCabinetOpen]
  id: ExtinguisherCabinetFilledOpen
  suffix: Filled, Open
