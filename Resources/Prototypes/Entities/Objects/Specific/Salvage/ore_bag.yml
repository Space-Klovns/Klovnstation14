- type: entity
  name: ore bag
  id: OreBag
  parent: BaseStorageItem
  description: A robust bag for salvage specialists and miners alike to carry large amounts of ore. Magnetises any nearby ores when attached to a belt.
  components:
  - type: MagnetPickup
    slotIrrespective: true # KS14 - a bit of the old power creep
  - type: Sprite
    sprite: Objects/Specific/Mining/ore_bag.rsi
    state: icon
  - type: Clothing
    sprite: Objects/Specific/Mining/ore_bag.rsi
    quickEquip: false
    slots:
    - belt
  - type: Item
    size: Small
  - type: Storage
    maxItemSize: Normal
    grid:
    - 0,0,9,3 # KS14 change
    quickInsert: true
    areaInsert: true
    whitelist:
      tags:
        - ArtifactFragment
        - Ore
  - type: Dumpable
  # KS14 start: a S.P.A.M. tablet clips on, and counts the ore that goes in for its tasks
  - type: KsSPAMOreBag
  - type: ItemSlots
    slots:
      ks_spam:
        name: ks-spam-ore-bag-slot
        whitelist:
          components:
          - KsSPAM
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: []
      ks_spam: !type:ContainerSlot
  - type: ItemMapper # the attached tablet shows on the bag, under the magnet
    sprite: _KS14/Objects/Specific/Mining/ore_bag_spam.rsi
    containerWhitelist: [ ks_spam ]
    mapLayers:
      spam:
        whitelist:
          components:
          - KsSPAM
  # KS14 end
  # WHITE DREAM EDIT START - KS14 port
  - type: ItemToggle
    soundActivate:
      collection: sparks
      params:
        variation: 0.250
    soundDeactivate:
      collection: sparks
      params:
        variation: 0.250
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          True: {state: orebag_on}
          False: {state: orebag_off}
  # WHITE DREAM EDIT END

- type: entity
  parent: OreBag
  id: BorgOreBag
  name: integrated ore bag
  description: A large ore bag built into the frame of a mining cyborg. Magnetises any nearby ores when held.
  components:
    - type: MagnetPickup
      slotFlags: null
      requireActiveHand: true
    - type: Storage
      grid:
      - 0,0,9,5
