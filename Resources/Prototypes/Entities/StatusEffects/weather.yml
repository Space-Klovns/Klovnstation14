- type: entity
  parent: StatusEffectBase
  id: WeatherBase
  abstract: true
  components:
  - type: WeatherStatusEffect
  - type: StatusEffect
    whitelist:
      components:
      - Map

- type: entity
  parent: WeatherBase
  id: WeatherRain
  components:
  # KS14 start: what it leaves on a player's visor
  - type: KsVisorPrecipitation
    dropsPerSecond: 6
    mist: 0.5
  # KS14 end
  - type: WeatherStatusEffect
    sprite:
      sprite: /Textures/Effects/weather.rsi
      state: rain
    sound:
      path: /Audio/_KS14/Effects/Weather/rain.ogg # KS14: Changed audio
      params:
        loop: true
        volume: -5.8 # KS14: -6 -> -5.8

