- type: entity
  id: RPD
  parent: RCD
  name: RPD
  description: A device used to rapidly pipe things.
  components:
  - type: RCD
    isRpd: true
    availablePrototypes:
    - PipeFourway
    - PipeStraight
    - PipeBend
    - PipeTJunction
    - OutletInjector
    - ManualValve
    - VolumetricPump
    - PressurePump
    - VentScrubber
    - PressureValve
    - DualPortVent
    - VentGas
    - VentPassive
    - MixerGas
    - Radiator
    - RadiatorBend
    - SignalValve
    - CanisterPort
    - FilterGas
    - PipeHalf
    - PipeManifold
    - PressureRegulator
    - PassiveGate
    - PipeSensor
    - Deconstruct
    - AirAlarm
    - AirSensor
  - type: LimitedCharges
    maxCharges: 90
  - type: Sprite
    sprite: _Starlight/Objects/Tools/rpd.rsi

- type: entity
  id: RPDEmpty
  parent: RPD
  suffix: Empty
  components:
  - type: LimitedCharges
    lastCharges: -1

- type: entity
  id: RPDRecharging
  parent: RPD
  name: experimental RPD
  description: Cyborg-mounted Rapid Piping Device which creates compressed matter on the fly using an internal fabricator.
  suffix: AutoRecharge
  components:
  - type: LimitedCharges
    maxCharges: 20
  - type: AutoRecharge
    rechargeDuration: 10

- type: entity
  id: RPDExperimental
  parent: RPD
  suffix: Admeme
  name: experimental RPD
  description: A bluespace-enhanced rapid piping device that passively generates its own compressed matter.
  components:
  - type: AutoRecharge
    rechargeDuration: 1

# =============================================================================
# RPLD (Rapid Plumbing Device) - places plumbing ducts and machines
# =============================================================================
- type: entity
  id: RPLD
  parent: RCD
  name: RPLD
  description: A device used to rapidly deploy plumbing ducts and machines.
  components:
  - type: Contraband
    allowedDepartments: [ Engineering, Medical ]
  - type: RCD
    isRPLD: true
    availablePrototypes:
    - PlumbingRpldDuctStraight
    - PlumbingRpldDuctBend
    - PlumbingRpldDuctTJunction
    - PlumbingRpldDuctFourway
    - PlumbingRpldTank
    - PlumbingRpldInput
    - PlumbingRpldOutput
    - PlumbingRpldSink
    - PlumbingRpldReactor
    - PlumbingRpldPillPress
    - PlumbingRpldFilter
    - PlumbingRpldSynthesizer
    - PlumbingRpldSmartFridge
    - PlumbingRpldDrain
    - Deconstruct
  - type: LimitedCharges
    maxCharges: 45
  - type: Sprite
    sprite: _Starlight/Objects/Tools/rpld.rsi

- type: entity
  id: RPLDEmpty
  parent: RPLD
  suffix: Empty
  components:
  - type: LimitedCharges
    lastCharges: -1

- type: entity
  id: RPLDRecharging
  parent: RPLD
  name: experimental RPLD
  description: Cyborg-mounted Rapid Plumbing Device which creates compressed matter on the fly using an internal fabricator.
  suffix: AutoRecharge
  components:
  - type: LimitedCharges
    maxCharges: 20
  - type: AutoRecharge
    rechargeDuration: 10

- type: entity
  id: RPLDExperimental
  parent: RPLD
  suffix: Admeme
  name: experimental RPLD
  description: A bluespace-enhanced rapid plumbing device that passively generates its own compressed matter.
  components:
  - type: AutoRecharge
    rechargeDuration: 1

- type: entity
  id: RCDXeno
  parent: [ BaseItem, BaseEngineeringContraband ]
  name: Xenoborg RCD
  description: Xenoborg-mounted Rapid Construction Device which creates compressed matter on the fly using an internal fabricator.
  components:
  - type: RCD
    availablePrototypes:
    - XenoDoor
    - XenoDoorGlass
    - XenoWall
    - XenoWindow
    - FloorXeno
    - Plating
    - Catwalk
    - Grille
    - Window
    - WindowDirectional
    - WindowReinforcedDirectional
    - Firelock
    - TubeLight
    - BulbLight
    - LVCable
    - MVCable
    - HVCable
    - CableTerminal
    - Deconstruct
  - type: LimitedCharges
    maxCharges: 25
  - type: AutoRecharge
    rechargeDuration: 10
  - type: Sprite
    sprite: _Starlight/Objects/Tools/xenoborg_rcd.rsi
    state: icon
  - type: Item
    size: Normal
  - type: PhysicalComposition
    materialComposition:
      Steel: 600
      Plastic: 100
  - type: StaticPrice
    price: 110
  - type: UserInterface
    interfaces:
      enum.RcdUiKey.Key:
        type: RCDMenuBoundUserInterface
  - type: ActivatableUI
    inHandsOnly: true
    key: enum.RcdUiKey.Key
