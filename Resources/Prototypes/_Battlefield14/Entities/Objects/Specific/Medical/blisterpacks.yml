- type: entity
  name: blister pack
  id: BlisterPack
  parent: [BaseStorageItem, RecyclableItemPlasticTiny]
  description: Holds up to 6 pills.
  components:
  - type: Item
    size: Tiny
    sprite: _Battlefield14/Objects/Specific/Medical/medicalV2.rsi
    heldPrefix: dressing
  - type: Icon
    sprite: _Battlefield14/Objects/Specific/Medical/blisterpackV2.rsi
    state: icon
  - type: Sprite
    sprite: _Battlefield14/Objects/Specific/Medical/blisterpackV2.rsi
    layers:
    - state: base
    - state: fill-1
      map: ["fill-1"]
      visible: false
    - state: fill-2
      map: ["fill-2"]
      visible: false
    - state: fill-3
      map: ["fill-3"]
      visible: false
    - state: fill-4
      map: ["fill-4"]
      visible: false
    - state: fill-5
      map: ["fill-5"]
      visible: false
    - state: fill-6
      map: ["fill-6"]
      visible: false
  - type: Tag
    tags:
      - PillCanister
      - BlisterPack
  - type: Storage
    grid:
    - 0,0,1,2
    quickInsert: true
    areaInsert: true
    areaInsertRadius: 1
    storageInsertSound: /Audio/Effects/pill_insert.ogg
    storageRemoveSound: /Audio/Effects/pill_remove.ogg
    whitelist:
      tags:
      - Pill
    hideStackVisualsWhenClosed: false
  - type: ItemCounter
    count:
      tags: [Pill]
    composite: true
    layerStates:
    - fill-1
    - fill-2
    - fill-3
    - fill-4
    - fill-5
    - fill-6
  - type: Appearance
  - type: Dumpable
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_Goobstation/Items/handling/pillbottle_pickup.ogg
  - type: EmitSoundOnDrop
    sound:
      path: /Audio/_Goobstation/Items/handling/pillbottle_drop.ogg

