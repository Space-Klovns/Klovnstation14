- type: entity
  id: WeaponHandlingLauncher
  description: "Has a minimum arming distance of 6 tiles."
  abstract: true
  components:
  - type: UseDelay
    delay: 1.75
  - type: ClothingSpeedModifier
    walkModifier: 0.9
    sprintModifier: 0.9
  - type: HeldSpeedModifier
  - type: SpeedModifiedOnWield
    walkModifier: 0.70
    sprintModifier: 0.70
  - type: KsWieldDelay
    baseDelay: 1.75
    preventFiring: true
  - type: KsWieldedCrosshair
    crosshair:
      sprite: _RMC14/Interface/MousePointer/explosive_mouse.rsi
      state: all

- type: entity
  id: WeaponHandlingLauncherDisposable
  description: "Has a minimum arming distance of 6 tiles."
  abstract: true
  components:
  - type: UseDelay
    delay: 1
  - type: ClothingSpeedModifier
    walkModifier: 0.95
    sprintModifier: 0.95
  - type: HeldSpeedModifier
  - type: SpeedModifiedOnWield
    walkModifier: 0.70
    sprintModifier: 0.70
  - type: KsWieldDelay
    baseDelay: 1
    preventFiring: true
  - type: Wieldable
    unwieldOnUse: true
  - type: KsWieldedCrosshair
    crosshair:
      sprite: _RMC14/Interface/MousePointer/explosive_mouse.rsi
      state: all
