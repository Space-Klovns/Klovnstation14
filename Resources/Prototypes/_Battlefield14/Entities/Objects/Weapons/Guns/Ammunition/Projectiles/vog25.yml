- type: entity
  id: BulletVOG25Thermobaric
  name: VG-40TB
  parent: BaseBulletTrigger
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Structural: 15
        Piercing: 40
    deleteOnCollide: true
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: Thermobaric
    totalIntensity: 20
    intensitySlope: 3
    maxIntensity: 2
    maxTileBreak: 0
  - type: SpawnOnTrigger
    proto: InstantEffectGravityWellThermobaric
  - type: Sprite
    sprite: _Battlefield14/Objects/Weapons/Guns/Ammunition/Casings/vog25.rsi
    layers:
    - state: vg40-spent
  - type: TimedDespawn
    lifetime: 10
  - type: PointLight
    radius: 3
    color: orange
    energy: 0.5

- type: entity
