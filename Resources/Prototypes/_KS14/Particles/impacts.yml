# Ported from TerraGov-Marine-Corps at c3c072e3644f4526d0099a79f361bde3aee9b4c7:
#   code/datums/elements/debris.dm: /particles/impact_smoke, /particles/debris
#   code/modules/projectiles/gun_system.dm: /particles/firing_smoke, /particles/overheat_smoke
# BYOND values converted to SS14 units: pixels / 32 = metres, per decisecond x10 = per second, per ds^2 x100,
# deciseconds / 10 = seconds, friction f per ds -> 1 - (1 - f)^10 per second. See Klovn/Docs/particles.md.

# A bullet's impact on a surface. KsImpactSurfaceSystem turns each emitter (KsParticles rotation) so that its -y
# points back at the shooter, out of the surface, which is where TGMC sends both.

# /particles/impact_smoke: count 5, spawning 15 per ds, so five at once; the holder goes at 0.7 s, as they die.
# TGMC's fade (3.3 s) outlasts the lifespan, so the puff starts faint and only fades further: a wisp, as there.
- type: ksParticles
  id: KsImpactSmoke
  count: 5
  burst: 5
  spawning: 0
  oneShot: true
  lifespan: 0.7
  fade: 3.3
  sprites:
  - sprite:
      sprite: /Textures/_KS14/Effects/Particles/blood_mist.rsi
      state: mist
  scale: 0.1
  grow: 0.65
  spin: { kind: num, a: -200, b: 200 }
  velocity: [ 0, -11.5625 ]
  friction: { kind: num, a: 0.9718, b: 0.9999 }
  drift: { kind: circle, a: 2.5, b: 2.5 }

# /particles/debris, as the debris element sets it up: count and spawning both its debris_amount, so one burst.
- type: ksParticles
  abstract: true
  id: KsImpactDebrisBase
  count: 5
  burst: 5
  spawning: 0
  oneShot: true
  lifespan: 0.7
  fade: 0.4
  velocity: [ 0, -12.5 ]
  friction: { kind: num, a: 0.9718, b: 0.9999 }
  # TGMC's generator(GEN_CIRCLE, offset, offset) with offset = rand(-6, 6): anywhere up to 6 px out.
  position: { kind: circle, a: 0, b: 0.1875 }
  rotation: { kind: num, a: -20, b: 20 }
  spin: { kind: num, a: -200, b: 200 }
  drift: { kind: circle, a: 0, b: 2.8125, dist: square }

# DEBRIS_SPARKS: metal walls, girders, metal barricades, shuttles. Eight of them, and lit by themselves.
- type: ksParticles
