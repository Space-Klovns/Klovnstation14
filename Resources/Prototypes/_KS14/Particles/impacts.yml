# /particles/firing_smoke: a puff out of the muzzle along the shot. KsGunFiringSmokeSystem turns -y along the shot.
# Toned down from TGMC's (five puffs at 12.5 m/s, growing to two tiles across), which fired constantly reads as fog:
# three, slower, smaller and shorter-lived, but still a visible puff.
- type: ksParticles
  id: KsGunFiringSmoke
  count: 3
  burst: 3
  spawning: 0
  oneShot: true
  lifespan: 0.6
  fade: 1.2
  color: "#FFFFFFB3"
  sprites:
  - sprite:
      sprite: /Textures/_KS14/Effects/Particles/blood_mist.rsi
      state: mist
  scale: 0.08
  grow: 0.35
  spin: { kind: num, a: -200, b: 200 }
  velocity: { kind: box, a: [ -0.3, -3 ], b: [ 0.3, -2 ] }
  friction: { kind: num, a: 0.9718, b: 0.9999 }
  drift: { kind: circle, a: 0, b: 0.5 }

# /particles/overheat_smoke: smoke curling up off a hot gun, for as long as it is hot. KsGunOverheatSmokeSystem turns
# it on and off. TGMC's 3 per ds into a cap of 1000, its z-drift (GEN_SPHERE) only ordering them.
- type: ksParticles
  id: KsGunOverheatSmoke
  count: 1000
  spawning: 30
  lifespan: 1.5
  fade: 1
  sprites:
  - sprite:
      sprite: /Textures/_KS14/Effects/Particles/smoke_small.rsi
      state: smoke_1
    weight: 1
  - sprite:
      sprite: /Textures/_KS14/Effects/Particles/smoke_small.rsi
      state: smoke_2
    weight: 1
  - sprite:
      sprite: /Textures/_KS14/Effects/Particles/smoke_small.rsi
      state: smoke_3
    weight: 2
  # TGMC's position list(8, 8) only moves BYOND's corner origin onto the gun; here the emitter is already on it.
  velocity: [ 0, 0.09375 ]
  gravity: 0, 2.96875
  friction: 0.8926
  grow: 0.5
  drift: { kind: sphere, a: 0, b: 0.3125, dist: normal }
