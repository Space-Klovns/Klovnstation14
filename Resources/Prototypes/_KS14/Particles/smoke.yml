  sprites:
  - sprite:
      sprite: /Textures/_KS14/Effects/Particles/smoke.rsi
      state: steam_1
  - sprite:
      sprite: /Textures/_KS14/Effects/Particles/smoke.rsi
      state: smoke_1
  - sprite:
      sprite: /Textures/_KS14/Effects/Particles/smoke.rsi
