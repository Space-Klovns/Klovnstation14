# Ported from tgstation's code/game/objects/effects/particles/smoke.dm (BYOND /particles/smoke and kin).
# BYOND values converted to SS14 units: pixels / 32 = metres, per decisecond x10 = per second, per ds^2 x100,
# deciseconds / 10 = seconds, friction f per ds -> 1 - (1 - f)^10 per second. See Klovn/Docs/particles.md.

- type: ksParticles
  id: KsSmoke
  size: [ 3.125, 3.125 ]
  count: 1000
  spawning: 40
  lifespan: 1.5
  fade: 1
  sprites:
  - sprite:
      sprite: /Textures/_KS14/Effects/Particles/smoke.rsi
      state: smoke_1
  - sprite:
      sprite: /Textures/_KS14/Effects/Particles/smoke.rsi
      state: smoke_2
  - sprite:
      sprite: /Textures/_KS14/Effects/Particles/smoke.rsi
      state: smoke_3
    weight: 2
  velocity: [ 0, 0.125 ]
  position: [ 0.1875, 0 ]
  drift:
    kind: sphere
    a: 0
    b: 0.0625
    dist: normal
  friction: 0.89
  gravity: [ 0, 2.97 ]
  grow: 0.5

- type: ksParticles
  parent: KsSmoke
  id: KsSmokeBurning
  position: [ 0, 0 ]

- type: ksParticles
  parent: KsSmokeBurning
  id: KsSmokeBurningSmall
  spawning: 10
