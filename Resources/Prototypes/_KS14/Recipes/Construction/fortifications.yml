- type: construction
  id: KsBarbedWire
  graph: KsBarbedWire
  startNode: start
  targetNode: barbedWire
  category: construction-category-structures
  objectType: Structure
  placementMode: SnapgridCenter
  canBuildInImpassable: false
  # Sandbags aren't Impassable (they can be climbed), so canBuildInImpassable alone lets wire be built into them.
  conditions:
  - !type:TileNotBlocked
    filterMobs: true

- type: construction
  id: KsSandbagWall
  graph: KsSandbagWall
  startNode: start
  targetNode: sandbagWall
  category: construction-category-structures
  objectType: Structure
  placementMode: SnapgridCenter
  canRotate: false
  canBuildInImpassable: false
  conditions:
  # MobMask, not just Impassable: a sandbag wall is only half a wall, and one mustn't go up inside another.
  - !type:TileNotBlocked
    filterMobs: true
