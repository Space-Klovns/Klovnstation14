- type: constructionGraph
  id: SurgeryGraph
  start: start
  graph:
  - node: start # ConstructionComponent.DeconstructionNode
    header: construction-component-to-perform-header
    localizedName: surgery-cleanup-name
    edges:
    - to: OpenIncision # Start surgery -> Incision
      steps:
      - tool: Slicing
        doAfter: 3
  - node: OpenIncision # Incision
    edges:
    - to: start # Incision -> Cauterise -> Stop surgery (early)
      steps:
      - tool: Welding
        doAfter: 1.5
    - to: RemoveHead # Incision -> Cut head
      conditions:
      - !type:HasOrgan
        category: Head
      steps: &amputation_steps
      - tool: Cutting
        doAfter: 5
    - to: RemoveEars # Incision -> Cut head
      conditions:
      - !type:HasOrgan
        category: Ears
      steps: *amputation_steps

  - node: RemoveHead # Cut head
    actions:
    - !type:TakeOrgan
      category: Head
  - node: RemoveEars # Cut ears
    actions:
    - !type:TakeOrgan
      category: Ears

- type: construction
  hide: true
  id: HeadRemoval
  name: surgery-head-removal-name
  description: surgery-head-removal-desc
  graph: SurgeryGraph
  startNode: start
  targetNode: RemoveHead
  category: Surgery
  objectType: NodeToNode
