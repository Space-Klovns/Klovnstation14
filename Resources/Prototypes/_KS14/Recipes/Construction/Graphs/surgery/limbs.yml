- type: constructionGraph
  id: SurgeryGraph
  start: start
  graph:
  - node: start # ConstructionComponent.DeconstructionNode
    header: construction-component-to-perform-header
    localizedName: surgery-cleanup-name
    edges:
    - to: OpenIncision # Start surgery -> Incision
      steps:
      - tool: Slicing
        doAfter: 3
  - node: OpenIncision # Incision
    edges: &surgery_transient
    - to: Base # Incision -> Cauterise -> Stop surgery (early)
      steps:
      - tool: Welding
        doAfter: 1.5
    - to: RemoveHead # Incision -> Cut head
      conditions:
      - !type:HasOrgan
        category: Head
      steps:
      - tool: Cutting
        doAfter: 5
    - to: RemoveArmLeft # Incision -> Cut left arm
      conditions:
      - !type:HasOrgan
        category: ArmLeft
      steps:
      - tool: Cutting
        doAfter: 5

  - node: RemoveHead # Cut head
    actions:
    - !type:TakeOrgan
      category: Head
  - node: RemoveArmLeft # Cut head
    actions:
    - !type:TakeOrgan
      category: Head

- type: construction
  hide: true
  id: HeadRemoval
  name: surgery-head-removal-name
  description: surgery-head-removal-desc
  graph: SurgeryGraph
  startNode: Base
  targetNode: RemoveHead
  category: Surgery
  objectType: NodeToNode
