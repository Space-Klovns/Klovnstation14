- type: constructionGraph
  id: SurgeryGraph
  start: start
  graph:
  - node: start # ConstructionComponent.DeconstructionNode
    edges:
    - to: OpenIncision # Start surgery -> Incision
      steps:
      - tool: Slicing
        doAfter: 8 # use the proper tool smh
    - to: OpenIncision # Start surgery -> Incision
      steps:
      - tool: Incision
        doAfter: 5
  - node: OpenIncision # Incision
    edges:
    # Cauterise to stop surgery early
    - to: start
      steps:
      - tool: Welding
        doAfter: 6.5
    - to: start
      steps:
      - tool: Cauterisation
        doAfter: 2.5

    ## Limb removal edges
    - to: Remove Head # Incision -> Cut head
      conditions:
      - !type:HasOrgan
        category: Head
      steps: &amputation_steps
      - tool: Cutting
        doAfter: 5
    - to: Remove Ears # Incision -> Cut ears
      conditions:
      - !type:HasOrgan
        category: Ears
      steps: *amputation_steps
    - to: Remove Eyes # Incision -> Cut ears
      conditions:
      - !type:HasOrgan
        category: Eyes
      steps: *amputation_steps
    ##

  ## Limb removal nodes
  - node: Remove Head # Cut head
    actions:
    - !type:TakeOrgan
      category: Head
    - !type:SetNode
      node: OpenIncision
  - node: Remove Ears # Cut ears
    actions:
    - !type:TakeOrgan
      category: Ears
    - !type:SetNode
      node: OpenIncision
  - node: Remove Eyes # Cut eyes
    actions:
    - !type:TakeOrgan
      category: Eyes
    - !type:SetNode
      node: OpenIncision
  ##
