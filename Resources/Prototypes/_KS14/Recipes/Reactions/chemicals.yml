- type: reaction
  id: Citadelium
  minTemp: 351.15 # boiling point of ethanol, to imply that space salt is somewhat organic
  reactants:
    SpaceSalt:
      amount: 1
    Epinephrine: # lol whatever
      amount: 1
    Hydrogen:
      amount: 1
    Copper:
      amount: 1
  products:
    Citadelium: 4

- type: reaction # since plasma is essentially tritiated ethanol, it would react EVIL with citadelium (what did i mean by this?)
  id: CitadeliumExplosion
  impact: High
  priority: 25
  conserveEnergy: false
  reactants:
    Citadelium:
      amount: 1
    Plasma:
      amount: 1
  effects:
  - !type:ExplosionReactionEffect
    explosionType: FireBomb
    intensityPerUnit: 0.75
    maxTotalIntensity: 130
    intensitySlope: 5
    maxIntensity: 12
