# tgstation's grab levels (GRAB_PASSIVE, GRAB_AGGRESSIVE, GRAB_NECK, GRAB_KILL). A grabber climbs them in the order
# its KsGrabber lists them, by ctrl-clicking whoever it pulls. See Klovn/Docs/grabs_and_shoves.md.

# A plain pull: the victim walks off whenever they like.
- type: ksGrabStage
  id: KsGrabPassive
  proneDragSpeedModifier: 0.7
  enterPopups:
    user: ks-grab-passive-user
    others: ks-grab-passive-others

# Instant from a pull. Takes a hand and holds the victim in place; they keep their hands.
- type: ksGrabStage
  id: KsGrabAggressive
  takesHand: true
  holdDistance: 0.6 # drawn in close
  blocksVictimMovement: true
  escapeChance: 0.6
  resistFailStaminaDamageMin: 12
  resistFailStaminaDamageMax: 23
  grabberSpeedModifier: 0.85
  allowsThrow: true
  victimAlert: KsGrabbedAggressive
  enterPopups:
    user: ks-grab-aggressive-user
    target: ks-grab-aggressive-target
    others: ks-grab-aggressive-others

# No damage, but pins the victim to the floor and is harder to break.
- type: ksGrabStage
  id: KsGrabNeck
  upgradeTime: 3
  takesHand: true
  holdDistance: 0.4
  requiredDistance: 0.8
  blocksVictimMovement: true
  floorsVictim: true
  escapeChance: 0.3
  resistFailStaminaDamageMin: 12
  resistFailStaminaDamageMax: 23
  grabberSpeedModifier: 0.75
  allowsThrow: true
  throwSpeedModifier: 1.5
  throwPopups:
    user: ks-grab-throw-hard-user
    target: ks-grab-throw-hard-target
    others: ks-grab-throw-hard-others
  victimAlert: KsGrabbedNeck
  enterPopups:
    user: ks-grab-neck-user
    target: ks-grab-neck-target
    others: ks-grab-neck-others

# Suffocates the victim, who has the worst odds of getting away.
- type: ksGrabStage
  id: KsGrabStrangle
  upgradeTime: 3
  takesHand: true
  holdDistance: 0.4
  requiredDistance: 0.6 # only chokes up close
  blocksVictimMovement: true
  floorsVictim: true
  escapeChance: 0.2
  resistFailStaminaDamageMin: 12
  resistFailStaminaDamageMax: 23
  grabberSpeedModifier: 0.65
  damage:
    types:
      Asphyxiation: 1.5
  damagePopup: ks-grab-strangle-damage
  allowsThrow: true
  throwSpeedModifier: 1.5
  throwPopups:
    user: ks-grab-throw-hard-user
    target: ks-grab-throw-hard-target
    others: ks-grab-throw-hard-others
  victimAlert: KsGrabbedStrangle
  enterPopups:
    user: ks-grab-strangle-user
    target: ks-grab-strangle-target
    others: ks-grab-strangle-others
