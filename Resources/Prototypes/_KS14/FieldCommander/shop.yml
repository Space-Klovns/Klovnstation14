# Where field commander defenders spend the points they earn killing the commander's units.
# Players already spawn with armour, medical supplies and endless ammunition, so this sells only what changes a fight.

- type: entity
  parent: ColMarTechScenarioBase
  id: KsFieldCommanderShop
  name: requisitions terminal
  suffix: Field Commander
  description: Field Operations' supply uplink. Confirmed kills are credited here, and spent on ordnance and fire support.
  components:
  # No Damageable: like every ColMarTech vendor, nothing can break it.
  - type: CMAutomatedVendor
    pointsType: KsFieldCommander
    sections:
    - name: Fire Support
      entries:
      - id: KsFlareSupplyPodReinforcementsAmmo
        points: 150
      - id: KsFlatpackBallisticTurretNanotrasenDisposable
        points: 200
      - id: KsFlareSupplyPodMissile
        points: 250
      - id: KsFlareSupplyPodReinforcementsSupport
        points: 300
    - name: Explosives
      entries:
      - id: GrenadeStinger
        points: 40
      - id: ExGrenade
        points: 60
      - id: KsScenarioNanoplantSeismicChargeShort
        points: 120
      - id: KsWeaponLauncherRocketAt4
        points: 350

# Flares that call a Nanotrasen reinforcement pod down on themselves, as the airstrike flare calls a missile.

- type: entity
  parent: KsFlareSupplyPodMissile
  id: KsFlareSupplyPodReinforcementsAmmo
  name: resupply flare
  description: Calls in a Nanotrasen ammunition pod to the location of the flare.
  components:
  - &reinforcementFlareSprite
    type: Sprite
    sprite: Objects/Misc/flare.rsi
    layers:
    - map: [ enum.ExpendableLightVisualLayers.Base ]
      state: flare_base
      color: "#3A7BFF"
    - map: [ enum.ExpendableLightVisualLayers.Overlay ]
      state: flare_unlit
      color: "#3A7BFF"
  - &reinforcementFlareLight
    type: PointLight
    enabled: false
    color: "#3A7BFF"
    radius: 2.0
    energy: 8
    netsync: false
  - type: SpawnOnTrigger
    keysIn:
    - timer
    proto: KsFieldCommanderReinforcementsAmmo

- type: entity
  parent: KsFlareSupplyPodMissile
  id: KsFlareSupplyPodReinforcementsSupport
  name: field support flare
  description: Calls in a Nanotrasen field support pod, with turrets and plasteel, to the location of the flare.
  components:
  - *reinforcementFlareSprite
  - *reinforcementFlareLight
  - type: SpawnOnTrigger
    keysIn:
    - timer
    proto: KsFieldCommanderReinforcementsSupport
