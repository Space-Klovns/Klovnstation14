# The field commander's uplink: the objective it lands in its final phase. The defenders win by hacking it (as any
#     scenario objective) or by breaking it; if it lasts until its timer runs out, it calls down the bombardment that
#     wins the commander the round.

- type: entity
  parent: KsScenarioObjectiveSyndie
  id: KsFieldCommandUplink
  name: field command uplink
  description: A hardened Syndicate relay, coordinating the assault and painting targets for an orbital bombardment. Take it down before it finishes.
  components:
  - type: Sprite
    sprite: Structures/Machines/telecomms.rsi
    snapCardinals: true
    color: '#FFB0B0'
    layers:
    - state: telecom-nopower
    - state: telecom-stripe
    - state: telecom-on
      shader: unshaded
      map: ["onstate"]
    - state: variant-nokey
      shader: unshaded
      map: ["variant"]
  - type: ScenarioObjective
    factionId: Syndicate
  # The bombardment countdown.
  - type: TimedDespawn
    lifetime: 600
  - type: PointLight
    radius: 4
    energy: 3
    color: '#FF2020'
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Damageable
    damageModifierSet: StrongMetallic
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 600
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          KsScenarioObjectiveCaptured:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Transform
    anchored: true
