- type: entity
  id: BaseCatwalkUnIconsmoothed
  name: catwalk
  description: A catwalk for easier EVA maneuvering and cable placement.
  abstract: true
  placement:
    mode: SnapgridCenter
  components:
  - type: Anchorable
    flags:
    - Anchorable
  - type: Rotatable
  - type: Clickable
  - type: Sprite
    sprite: Structures/catwalk.rsi
    drawdepth: FloorTiles
  - type: Transform
    anchored: true
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepCatwalk
      params:
        volume: 8
  - type: Tag
    tags:
    - Catwalk
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        damage: 500
      behaviors:
      - acts: ["Destruction"]
    - trigger:
        damage: 200
      behaviors:
      - spawn:
          PartRodMetal:
            min: 0
            max: 1
      - acts: ["Destruction"]
  - type: TrayScanReveal
  - type: RCDDeconstructable
    cost: 2
    delay: 2
    fx: EffectRCDDeconstruct2
...
