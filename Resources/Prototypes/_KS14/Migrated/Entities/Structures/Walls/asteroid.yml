- type: entity
  id: BaseUngatherableAsteroidRock
  parent: BaseWall
  name: asteroid rock
  description: A rocky asteroid.
  abstract: true
  components:
  - type: Transform
    noRot: true
  - type: IconSmooth
    key: walls
    mode: NoSprite
  - type: SmoothEdge
  - type: Icon
    sprite: Structures/Walls/rock.rsi
    state: rock_asteroid
  - type: Sprite
    sprite: Structures/Walls/rock.rsi
    layers:
    - state: rock_asteroid
    - map: ["enum.EdgeLayer.South"]
      state: rock_asteroid_south
    - map: ["enum.EdgeLayer.East"]
      state: rock_asteroid_east
    - map: ["enum.EdgeLayer.North"]
      state: rock_asteroid_north
    - map: ["enum.EdgeLayer.West"]
      state: rock_asteroid_west
  - type: MiningScannerViewable
  - type: Damageable
    damageModifierSet: Rock
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        damage: 120
      behaviors:
      - acts: ["Destruction"]
      - sound:
          path: /Audio/Effects/break_stone.ogg
          params:
            volume: -6
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          bounds: "-0.5,-0.5,0.5,0.5"
        mask:
        - FullTileMask
        layer:
        - WallLayer
        density: 2000
- type: entity
  id: BaseUngatherableIronRock
  parent: BaseUngatherableAsteroidRock
  name: ironrock
  suffix: Low Ore Yield
  description: A rocky asteroid.
  abstract: true
  components:
  - type: IconSmooth
    key: walls
    mode: NoSprite
  - type: Icon
    sprite: Structures/Walls/rock.rsi
    state: ironrock
  - type: SmoothEdge
  - type: Sprite
    sprite: Structures/Walls/rock.rsi
    layers:
    - state: ironrock
    - map: ["enum.EdgeLayer.South"]
      state: ironrock_south
    - map: ["enum.EdgeLayer.East"]
      state: ironrock_east
    - map: ["enum.EdgeLayer.North"]
      state: ironrock_north
    - map: ["enum.EdgeLayer.West"]
      state: ironrock_west
...
