- type: entity
  parent: BaseComputerAiAccess
  id: MassDriverComputer
  name: mass driver computer
  description: A computer for control mass driver.
  components:
  - type: MassDriverConsole
  - type: ActivatableUI
    key: enum.MassDriverConsoleUiKey.Key
  - type: UserInterface
    interfaces:
      enum.MassDriverConsoleUiKey.Key:
        type: MassDriverConsoleBoundUserInterface
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: sensors
    - map: ["computerLayerKeys"]
      state: generic_keys
    - map: ["enum.WiresVisualLayers.MaintenancePanel"]
      state: generic_panel_open
  - type: Computer
    board: MassDriverComputerCircuitboard
  - type: PointLight
    radius: 1.5
    energy: 1.6
    color: "#3c5eb5"
  - type: DeviceList
  - type: DeviceNetwork
    deviceNetId: Wired
  - type: DeviceLinkSource
    range: 5
    ports:
    - MassDriverConsoleSender
  - type: ItemSlots
  - type: ContainerContainer
    containers:
      board: !type:Container ''
...
