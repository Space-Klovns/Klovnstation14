- type: entity
  id: Anchorless
  parent: [BaseGameRule, BaseRoundstartAntagRule]
  components:
  - type: GameRule
    minPlayers: 5
  - type: AnchorlessRule
  - type: AntagObjectives
    objectives:
    - AnchorlessConvertCrewObjective
  - type: AntagSelection
    agentName: anchorless-round-end-agent-name
    antags:
    - !type:LinearAntagCount
      proto: Anchorless
      range:
        min: 1
        max: 3
