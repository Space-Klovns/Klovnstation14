# Skeleton Crew's events. Each one is an upstream event under a KsSkeletonCrew id, with its start time cut to about
#   75% of upstream's (rounded), and its player minimum lowered so that it can run on a crew of 3 to 25. Everything
#   else is inherited, so a change to the upstream event reaches these too.
#   Left out on purpose: meteor swarms and the immovable rod (station damage; space dust has its own scheduler),
#   the power grid check, the nuke calibration, and antagonists too strong for a small crew.

- type: entityTable
  id: KsSkeletonCrewEventsTable
  table: !type:AllSelector # a list, so that StationEvent's own limits still apply
    children:
    - id: BluespaceLocker
    - id: KsSkeletonCrewAnomalySpawn
    - id: KsSkeletonCrewBluespaceArtifact
    - id: KsSkeletonCrewGasLeak
    - id: KsSkeletonCrewIonStorm
    - id: KsSkeletonCrewSolarFlare
    - id: KsSkeletonCrewRandomSentience
    - id: KsSkeletonCrewCockroachMigration
    - id: KsSkeletonCrewSnailMigrationLowPop
    - id: KsSkeletonCrewMouseMigration
    - id: KsSkeletonCrewKingRatMigration
    - id: KsSkeletonCrewBreakerFlip
    - id: KsSkeletonCrewClericalError
    - id: KsSkeletonCrewBureaucraticError
    - id: KsSkeletonCrewClosetSkeleton
    - id: KsSkeletonCrewGreytideVirus
    - id: KsSkeletonCrewMimicVendorRule
    - id: KsSkeletonCrewVentClog
    - id: KsSkeletonCrewKudzuGrowth
    - id: KsSkeletonCrewSlimesSpawnHorde
    - id: KsSkeletonCrewSnakeSpawnHorde
    - id: KsSkeletonCrewSpiderSpawnHorde
    - id: KsSkeletonCrewSpiderClownSpawnHorde

- type: entityTable
  id: KsSkeletonCrewFluffEventsTable
  table: !type:AllSelector
    children:
    - id: KsSkeletonCrewRandomCritterHorde
    - id: KsSkeletonCrewMassHallucinations
    - id: KsSkeletonCrewGiftsPizzaPartySmall
    - id: KsSkeletonCrewGiftsEngineering
    - id: KsSkeletonCrewGiftsJanitor
    - id: KsSkeletonCrewGiftsMedical
    - id: KsSkeletonCrewGiftsSpacingSupplies
    - id: KsSkeletonCrewGiftsFireProtection
    - id: KsSkeletonCrewGiftsVendingRestock

