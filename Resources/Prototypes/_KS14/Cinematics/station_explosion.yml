# Scene durations match the states' animation lengths in the RSI, so they play at their own frame timings.
# The hold scene before the climax stretches, so whoever plays the cinematic can time the climax.

- type: ksCinematic
  abstract: true
  id: KsCinematicStationExplosionBase
  sprite: _KS14/Cinematic/station_explosion.rsi

- type: ksCinematic
  parent: KsCinematicStationExplosionBase
  id: KsCinematicNukeWin
  scenes:
  - state: intro_nuke
    duration: 3
  - state: station_intact
    duration: 2
    stretch: true
  - state: station_explode_fade_red
    duration: 7.9
    sounds:
    - sound:
        path: /Audio/Effects/explosionfar.ogg
        params:
          volume: -6
  - state: summary_nukewin
    duration: 6

