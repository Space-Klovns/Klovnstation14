# The liquid fuel cuts. Each lights itself at its autoignition temperature, so a hot leak burns.

- type: reagent
  parent: KsBaseHydrocarbon
  id: KsNaphtha
  name: reagent-name-ks-naphtha
  desc: reagent-desc-ks-naphtha
  color: "#d9c98a"
  boilingPoint: 370
  meltingPoint: 180
  fluidmos:
    molarMass: 100
    latentHeat: 170
    mixingFamily: KsHydrocarbon
  tileEffects:
  - !type:LogicAndTileEffect
    conditions:
    - !type:CheckTemperatureTileEffect
      minimum: 520
    effects:
    - !type:ChemicalFireTileEffect
      removed: 2
      durationScale: 2
  - !type:BoilTileEffect
    smoke: true
  tileReactions:
  - !type:FlammableTileReaction {}

