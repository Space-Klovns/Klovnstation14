- type: reagent
  parent: BasePyrotechnic
  id: Sorium
  name: reagent-name-sorium
  desc: reagent-desc-sorium
  physicalDesc: reagent-physical-desc-grainy
  flavor: bitter
  color: '#5a64c8'
  contrabandSeverity: Minor
  metabolisms:
    Bloodstream:
      metabolismRate: 1.0
      effects:
      - !type:PopupMessage
        type: Local
        visualType: SmallCaution
        probability: 0.3
        messages:
        - sorium-effect-pain
      - !type:HealthChange
        damage:
          types:
            Blunt: 3
            Piercing: 1

      - !type:Gib
        conditions:
        - !type:ReagentCondition
          reagent: Sorium
          min: 20
      - !type:PopupMessage
        conditions:
        - !type:ReagentCondition
          reagent: Sorium
          min: 20
        type: Pvs
        visualType: LargeCaution
        messages:
        - sorium-effect-gib

- type: reagent
  parent: BasePyrotechnic
  id: SuspendedKlovnideTrioxide
  name: reagent-name-suspended-klovnide-trioxide
  desc: reagent-desc-suspended-klovnide-trioxide
  physicalDesc: reagent-physical-desc-oily
  color: "#7e204f"
  friction: 0.4
  ksSpreadVolume: 0.5 # a film: 100u covers about 200 tiles. Lower means more puddles and fires, each an entity
  tileEffects:
  - !type:ChemicalFireTileEffect
    removed: 0.5 # u/s: its fire can't be put out, so the puddle has to burn itself away
    durationScale: 2
    id: ChemicalFireSuspendedKlovnideTrioxide
  tileReactions:
  - !type:FlammableTileReaction {}
