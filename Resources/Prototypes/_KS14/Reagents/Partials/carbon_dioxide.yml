# Carbon dioxide as a liquid or solid, as it comes out of a CO2 extinguisher (KsFireExtinguisherCarbonDioxide), and as
#     Fluidmos condenses it out of its gas: it always ends up as very cold gas, and shoves the air it lands in out of
#     the way.
#
# A unit is not a gram here: it becomes 4 mol of gas (molesPerUnit), about 175 times as much, so that a few seconds of
#     spray clears a tile of most of its air instead of barely denting it. Its specific heat is matched to that, at
#     4 mol x 30 J/(mol K) (the gas's molar heat capacity) / 8 (the default atmos.heat_scale) = 15, so the gas comes out
#     at the temperature the reagent was at. Latent heats keep real CO2's ratio of latent to sensible heat (about 680 K),
#     and the spray's is raised further, as water's ExtinguishTileReaction energy is.
#
# Dry ice: its vapor-pressure curve is the solid's, subliming at 194.65 K under one atmosphere (real ΔH_sub 25.2 kJ/mol,
#     so ΔS/R = 15.6), and its melting point is the 216.55 K triple point. Below about 5 atm it never stays liquid: a
#     cold puddle of it sublimes, and in a pipe it condenses straight to solid. Subliming costs latentHeat plus
#     fusionHeat, 10200 together, split in real CO2's 8.6 / 25.2 share of the sublimation heat.
- type: !PartialOnly reagent
  id: CarbonDioxide
  boilingPoint: 194.65 # where it sublimes at one atmosphere
  meltingPoint: 216.55 # the triple point
  specificHeat: 15
  fluidmos:
    gas: CarbonDioxide
    molesPerUnit: 4
    vaporizationEntropy: 15.6
    latentHeat: 6700
    fusionHeat: 3500
  tileReactions:
  # Into a puddle it lands on first, which it then boils out of, cooling it.
  - !type:SpillIfPuddlePresentTileReaction
  # Otherwise straight to gas, cooling the air, never below where it sublimes at the tile's pressure. Whatever air already
  #     too cold cannot turn to gas lands as a cold puddle, which sublimes as the air warms (the BoilTileEffect below).
  - !type:KsVaporizeTileReaction
    energyPerUnit: 30000
    displace: true
    spillRemainder: true
  tileEffects:
  # Its gas, latent heat and moles per unit are its Fluidmos ones. Below where it sublimes it still evaporates into air
  #     short of it, at the Hertz-Knudsen rate.
  - !type:BoilTileEffect
    displace: true
    sublimate: true
    evaporate: true
  # Only above the triple point's pressure: below it, it has no liquid to freeze, and sublimes instead.
  - !type:FreezeTileEffect { }
