# Water boils off a puddle hotter than its boiling point, taking its latent heat with it.
- type: !PartialOnly reagent
  id: Water
  tileEffects:
  - !type:BoilTileEffect { }

# Water, space cleaner and bleach wash stains off. See KsStainCleaning.
- type: !PartialOnly reagent
  id: Water
  reactiveEffects:
    KsStainCleaning:
      methods: [ Touch ]
      effects:
      - !type:StainClean
