# Ghost roles that tell every ghost when they appear mid-round. Ghost roles are quiet unless listed here (or made by an
# admin's makeghostrole command). Keep this to rare, significant arrivals: anything an event spawns in numbers (vent
# hordes, slimes, spiders, carp, mice, xenos) stays quiet, or ghosts hear it once per mob.

# Antagonists and threats that arrive mid-round, one at a time.

