- type: entity
  parent: BaseStructure
  id: KsMooringDevice
  placement:
    mode: AlignTileAny
  components:
  - type: Sprite
    sprite: Structures/Power/Generation/portable_generator.rsi
    layers:
    - state: portgen0
    - state: portgen_on_unlit
      shader: unshaded
      map: [ "enum.PowerDeviceVisualLayers.Powered" ]
  - type: Transform
    anchored: true
    noRot: false
  - type: InteractionOutline
  - type: ApcPowerReceiver
    powerLoad: 10000
  - type: ExtensionCableReceiver
  - type: ApcPowerReceiverBattery
    idleLoad: 10000
    batteryRechargeRate: 20000
    batteryRechargeEfficiency: 1
  - type: Battery
    netsync: false
    maxCharge: 1200000
    startingCharge: 1200000
  - type: ExaminableBattery
  - type: PowerSwitch
  - type: MooringDevice
    warningLevels: [ 0.5, 0.25, 0.1 ]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        enum.PowerDeviceVisualLayers.Powered:
          True: { visible: true }
          False: { visible: false }
