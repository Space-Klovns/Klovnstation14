# In-character languages. Names and descriptions in Locale/en-US/_KS14/language/language.ftl.

# The station default; entities without language components implicitly know exactly this.
- type: ksLanguage
  id: KsLangCommon
  sortOrder: 0
  obfuscation: !type:KsCannedObfuscation
    lines:
    - ks-language-obfuscation-incomprehensible

