# The syndicate cant is acquired only through this uplink implant.

- type: entity
  parent: BaseSubdermalImplant
  id: KsSyndicateLanguageImplant
  name: cant implant
  description: A cortical language chip teaching the recipient the syndicate field cant.
  categories: [ HideSpawnMenu ]
  components:
  - type: SubdermalImplant
  - type: KsLanguageGrant
    speaks: [ KsLangSyndicate ]
    understands: [ KsLangSyndicate ]

- type: entity
  parent: BaseImplantOnlyImplanterSyndi
  id: KsSyndicateLanguageImplanter
  name: cant implanter
  components:
  - type: Implanter
    implant: KsSyndicateLanguageImplant

- type: listing
  id: KsUplinkSyndicateLanguageImplanter
  name: ks-uplink-cant-implanter-name
  description: ks-uplink-cant-implanter-desc
  productEntity: KsSyndicateLanguageImplanter
  cost:
    Telecrystal: 4
  categories:
    - UplinkImplants
