- type: antag
  id: Anchorless
  name: roles-antag-anchorless-name
  antagonist: true
  setPreference: true
  objective: roles-antag-anchorless-objective
  requirements:
  - !type:OverallPlaytimeRequirement
    time: 1h

- type: antagSpecifier
  parent: RestrictedAntag
  id: Anchorless
  prefRoles:
  - Anchorless
  briefing:
    text: anchorless-role-greeting
    color: Red
    sound: /Audio/Ambience/Antag/changeling_start.ogg
  blacklist:
    components:
    - AntagImmune
  components:
  - type: KsAnchorlessAntag
  - type: AnchorlessFaction
  - type: VoiceMask
    action: ActionAnchorlessVoiceMimic
    isInnate: true
    changeIDName: false
    accentHide: false
    titleText: changeling-voice-mimic-window-title
  - type: ActionGrant
    actions:
    - ActionAnchorlessCommunion
    - ActionAnchorlessTransform
    - ActionAnchorlessConvert
    - ActionAnchorlessHorror
  - type: IntrinsicRadioReceiver
  - type: ActiveRadio
    channels:
    - Anchorless
  - type: IntrinsicRadioTransmitter
    channels:
    - Anchorless
  mindRoles:
  - MindRoleAnchorless
