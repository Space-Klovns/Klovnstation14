- components:
  - sprite: _KS14/Structures/Storage/canister.rsi
    layers: !Remove
    - state: multi_shader
      color: "#6B6B80"
    - state: outline
      color: "#6B6B80"
    - state: window-base
    - state: paper
      visible: false
      map: ["enum.PaperLabelVisuals.Layer"]
      sprite: Structures/Storage/canister.rsi
    type: Sprite
  - visuals:
      enum.GasCanisterVisuals.PressureState:
        pressureLight:
          0:
            state: can-0
          1:
            state: can-1
          2:
            state: can-2
          3:
            state: can-3
      enum.PaperLabelVisuals.LabelType:
        enum.PaperLabelVisuals.Layer:
          Paper:
            sprite: Structures/Storage/canister.rsi
          Bounty:
            sprite: Structures/Storage/canister.rsi
          CaptainsPaper:
            sprite: Structures/Storage/canister.rsi
          Invoice:
            sprite: Structures/Storage/canister.rsi
      enum.BatteryShieldingVisuals.Active:
        shielding:
          False: {visible: false}
          True: {state: shielding, visible: true, shader: unshaded}
      enum.LockVisuals.Locked: !Remove ''
    type: GenericVisualizer
  - type: BatteryShielding
    falterPopupLoc: gas-canister-shielding-popup-falter
    failPopupLoc: gas-canister-shielding-popup-fail
    emagMalfunctionPopupLoc: gas-canister-shielding-popup-emag-malfunction
    emagMalfunctionDuration: 3s
    emagImplosionDamage:
      types:
        Blunt: 350
    uiKey: enum.GasCanisterUiKey.Key
  - type: BatterySelfRecharger
    autoRechargeRate: 1000
    autoRechargePauseTime: 10s
  - type: Battery
    maxCharge: 30000
    startingCharge: 30000
  - thresholds: !Remove
    - trigger:
        damage: 600
      behaviors:
      - acts: ["Destruction"]
    - trigger:
        damage: 300
      behaviors:
      - sound:
          collection: MetalBreak
      - spawn:
          GasCanisterBrokenBase:
            min: 1
            max: 1
      - acts: ["Destruction"]
    type: Destructible
  - maxIntegrity: 4
    integrity: 4
    safetyPressure: 220220220220220220
    type: GasCanister
  - type: GasCanisterOverlay
  - type: EmissiveLayers
    glowRadius: 1
    intensity: 0.35
    layers:
    - pressureLight
    - shielding
  - type: KsGasMaxPressureInterval
    interval: 2.20s
    popupType: MediumCaution
    popupLocs:
      0.75: ks-canister-maxpressure-popup-4
      1.2: ks-canister-maxpressure-popup-3
      3: ks-canister-maxpressure-popup-2
      5: ks-canister-maxpressure-popup-1
  - type: KsGasMaxPressureSound
    finalOverpressureThreshold: 0.75
    overpressureSound:
      collection: KsCanisterHiss
      params:
        variation: 0.06
    finalOverpressureSound:
      collection: KsCanisterThud
      params:
        volume: 12
        pitch: 0.85
  - type: MaxPressureVisuals
  - type: Lock
  type: !PartialOnly entity
  id: GasCanister
