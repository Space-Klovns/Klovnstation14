- components:
  - layers: !Remove
    - state: condisposal
      map: ["enum.DisposalUnitVisualLayers.Unanchored"]
    - state: disposal
      map: ["enum.DisposalUnitVisualLayers.Base"]
    - state: disposal-charging
      map: ["enum.DisposalUnitVisualLayers.BaseCharging"]
    - state: disposal-flush
      map: ["enum.DisposalUnitVisualLayers.OverlayFlush"]
    - state: dispover-charge
      map: ["enum.DisposalUnitVisualLayers.OverlayCharging"]
      shader: unshaded
    - state: dispover-ready
      map: ["enum.DisposalUnitVisualLayers.OverlayReady"]
      shader: unshaded
    - state: dispover-full
      map: ["enum.DisposalUnitVisualLayers.OverlayFull"]
      shader: unshaded
    - state: dispover-handle
      map: ["enum.DisposalUnitVisualLayers.OverlayEngaged"]
    type: Sprite
  - type: EmissiveLayers
    glowRadius: 0.25
    intensity: 3
    layers:
    - enum.DisposalUnitVisualLayers.OverlayCharging
    - enum.DisposalUnitVisualLayers.OverlayReady
    - enum.DisposalUnitVisualLayers.OverlayFull
  - thresholds: !Remove
    - trigger:
        damage: 200
      behaviors:
      - acts: ["Destruction"]
    - trigger:
        damage: 100
      behaviors:
      - acts: ["Destruction"]
      - sound:
          collection: MetalBreak
          params:
            volume: -6
      - spawn:
          SheetSteel1:
            min: 1
            max: 1
    type: Destructible
  - containers:
      disposals: !type:Container ''
      DisposalUnitComponent: !Remove ''
    type: ContainerContainer
  - type: StationAiWhitelist
  - type: DisposalUnit
  - type: GenericVisualizer
  type: !PartialOnly entity
  id: DisposalUnitBase
- components:
  - type: DisposalUnit
  - containerId: disposals
    type: ThrowInsertContainer
  - type: DeviceLinkSink
    ports:
    - FillbotAnyItem
  type: !PartialOnly entity
  id: DisposalUnit
- components:
  - snapCardinals: true
    layers: !Remove
    - state: conmailing
      map: ["enum.DisposalUnitVisualLayers.Unanchored"]
    - state: mailing
      map: ["enum.DisposalUnitVisualLayers.Base"]
    - state: mailing-charging
      map: ["enum.DisposalUnitVisualLayers.BaseCharging"]
    - state: mailing-flush
      map: ["enum.DisposalUnitVisualLayers.OverlayFlush"]
    - state: dispover-charge
      map: ["enum.DisposalUnitVisualLayers.OverlayCharging"]
      shader: unshaded
    - state: dispover-ready
      map: ["enum.DisposalUnitVisualLayers.OverlayReady"]
      shader: unshaded
    - state: dispover-full
      map: ["enum.DisposalUnitVisualLayers.OverlayFull"]
      shader: unshaded
    - state: mailover-handle
      map: ["enum.DisposalUnitVisualLayers.OverlayEngaged"]
    type: Sprite
  - flushingState: !Remove ''
    type: DisposalUnit
  - type: DeviceLinkSink
    ports:
    - FillbotAnyItem
  - type: GenericVisualizer
  type: !PartialOnly entity
  id: MailingUnit
...
