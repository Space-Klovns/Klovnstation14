- components:
  - type: EmissiveLayers
    glowRadius: 1
    intensity: 0.5
    offset: 0,-1.35
    layers:
    - enum.DoorVisualLayers.BaseUnlit
    - enum.DoorVisualLayers.BaseBolted
    - enum.DoorVisualLayers.BaseEmergencyAccess
    - enum.DoorVisualLayers.BaseEmagging
  - type: DoorPrySound
    openSound:
      path: /Audio/_KS14/Machines/Airlocks/open_force.ogg
      params:
        volume: -2.5
        variation: 0.05
    closeSound:
      path: /Audio/_KS14/Machines/Airlocks/close_force.ogg
      params:
        volume: -2.5
        variation: 0.05
  - playSoundsWhenPrying: false
    type: Door
  - onActivateInWorld: !Remove ''
    type: Electrified
  - tags: !Remove
    - Airlock
    - DoorRemoteWhitelist
    - HristovWindowVentable
    type: Tag
  type: !PartialOnly entity
  id: Airlock
- components:
  - tags: !Remove
    - GlassAirlock
    - DoorRemoteWhitelist
    - HristovWindowVentable
    type: Tag
  type: !PartialOnly entity
  id: AirlockGlass
...
