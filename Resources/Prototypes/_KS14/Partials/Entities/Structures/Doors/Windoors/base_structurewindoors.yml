- components:
  - layers: !Remove
    - state: closed
      map: ["enum.DoorVisualLayers.Base"]
    - state: closed_unlit
      shader: unshaded
      map: ["enum.DoorVisualLayers.BaseUnlit"]
      visible: false
    - state: welded
      map: ["enum.WeldableLayers.BaseWelded"]
    - state: bolted_unlit
      shader: unshaded
      map: ["enum.DoorVisualLayers.BaseBolted"]
    - state: emergency_unlit
      shader: unshaded
      map: ["enum.DoorVisualLayers.BaseEmergencyAccess"]
    - state: panel_open
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
    - state: electrified_ai
      sprite: Interface/Misc/ai_hud.rsi
      shader: unshaded
      visible: false
      map: ["enum.ElectrifiedLayers.HUD"]
    - state: electrified
      sprite: Effects/electricity.rsi
      shader: unshaded
      visible: false
      map: ["enum.ElectrifiedLayers.Sparks"]
    - state: sparks
      map: ["enum.DoorVisualLayers.BaseEmagging"]
      shader: unshaded
      visible: false
    - type: EmissiveLayers
      glowRadius: 0.4
      intensity: 4
      layers:
      - enum.DoorVisualLayers.BaseUnlit
      - enum.DoorVisualLayers.BaseBolted
      - enum.DoorVisualLayers.BaseEmergencyAccess
      - enum.DoorVisualLayers.BaseEmagging
    type: Sprite
  - thresholds: !Remove
    - trigger:
        damage: 400
      behaviors:
      - acts: ["Destruction"]
    - trigger:
        damage: 200
      behaviors:
      - spawn:
          ShardGlass:
            min: 1
            max: 2
          SheetSteel1:
            min: 2
            max: 4
      - acts: ["Destruction"]
    type: Destructible
  - tags: !Remove
    - Directional
    - DoorRemoteWhitelist
    type: Tag
  type: !PartialOnly entity
  id: BaseWindoor
