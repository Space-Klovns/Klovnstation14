- parent: BaseItem
  components:
  - type: Sticky
    stickDelay: 5
    unstickDelay: 5
    stickPopupStart: comp-sticky-start-stick-bomb
    stickPopupSuccess: comp-sticky-success-stick-bomb
    unstickPopupStart: comp-sticky-start-unstick-bomb
    unstickPopupSuccess: comp-sticky-success-unstick-bomb
    blacklist:
      components:
      - Item
      - Spectral
    stuckOffset: 0,-0.25
  - type: ComponentsOnStick
    requiresOccluder: true
    components:
    - type: WallMount
      arc: 80
  - thresholds: !Remove
    - trigger:
        damage: 50
      behaviors:
      - !type:ExplodeBehavior ''
    type: Destructible
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_KS14/Handling/component_pickup.ogg
  - type: EmitSoundOnDrop
    sound:
      path: /Audio/_KS14/Handling/component_drop.ogg
  - type: Explosive
  type: !PartialOnly entity
  id: BasePlasticExplosive
- components:
  - type: TriggerOnActivate
  - type: TriggerOnSignal
  - type: TriggerOnStuck
    keyOut: stuck
  - type: ToggleTriggerCondition
    keys:
    - stuck
    toggleVerb: toggle-trigger-condition-stick-verb
    toggleOn: toggle-trigger-condition-stick-on
    toggleOff: toggle-trigger-condition-stick-off
  - type: TimerTrigger
    keysIn:
    - trigger
    - stuck
    delay: 10
    delayOptions: [10, 30, 60, 120, 300]
    initialBeepDelay: 0
    beepSound: /Audio/Machines/Nuke/general_beep.ogg
  - type: DeviceLinkSink
    ports:
    - Trigger
  - type: Explosive
    explosionType: DemolitionCharge
    totalIntensity: 60
    intensitySlope: 5
    maxIntensity: 30
    canCreateVacuum: false
  - type: ExplodeOnTrigger
    keysIn:
    - timer
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_KS14/Handling/component_pickup.ogg
  - type: EmitSoundOnDrop
    sound:
      path: /Audio/_KS14/Handling/component_drop.ogg
  type: !PartialOnly entity
  id: C4
- components:
  - type: TriggerOnActivate
  - type: TriggerOnSignal
  - type: TriggerOnStuck
    keyOut: stuck
  - type: ToggleTriggerCondition
    keys:
    - stuck
    toggleVerb: toggle-trigger-condition-stick-verb
    toggleOn: toggle-trigger-condition-stick-on
    toggleOff: toggle-trigger-condition-stick-off
  - keysIn:
    - trigger
    - stuck
    initialBeepDelay: 0
    type: TimerTrigger
  - type: DeviceLinkSink
    ports:
    - Trigger
  - type: ExplodeOnTrigger
    keysIn:
    - timer
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_KS14/Handling/component_pickup.ogg
  - type: EmitSoundOnDrop
    sound:
      path: /Audio/_KS14/Handling/component_drop.ogg
  type: !PartialOnly entity
  id: SeismicCharge
...
