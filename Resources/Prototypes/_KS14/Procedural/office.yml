- type: ksProcgenTilePack
  id: KsProcgenOfficeTiles
  tags:
  - station
  - office
  palettes:
  - id: SteelOffice
    primaryTile: FloorSteel
    accentTile: FloorSteelCheckerLight
    accentFraction: 0.12
  - id: MiniSteelOffice
    primaryTile: FloorSteelMini
    accentTile: FloorSteel
    accentFraction: 0.08

- type: ksProcgenWallPack
  id: KsProcgenOfficeWalls
  tags:
  - station
  - office
  families:
  - id: SteelOffice
    interiorWall: WallSolid
    hullWall: WallReinforced
    door: Airlock
    window: Window

- type: ksProcgenWallPack
  id: KsProcgenNoDoorWallsFixture
  families:
  - id: NoDoor
    interiorWall: WallSolid

- type: ksProcgenLightingPack
  id: KsProcgenOfficeLights
  tags:
  - station
  - office
  fixtures:
  - id: PostLight
    entity: LightPostSmall
    preferredSpacing: 6
    supply: SelfContained

- type: ksProcgenAssembly
  id: KsProcgenOfficeWorkstationAssembly
  anchorMember: Desk
  members:
  - id: Desk
    entity: Table
    role: PrimaryFurniture
    movement: VaultRequired
    rotationMode: Independent
  - id: Chair
    entity: ChairOfficeLight
    role: Seat
    movement: Clear
    rotationMode: Independent
  - id: Console
    entity: ComputerAlert
    role: Equipment
    requiresInteractionApproach: true
    rotationMode: Independent
  relations:
  - id: ChairBesideDesk
    subject: Chair
    kind: AdjacentTo
    target: Desk
  - id: ChairFacesConsole
    subject: Chair
    kind: FacingTarget
    target: Console
  - id: ConsoleUsesChair
    subject: Console
    kind: UsesSeat
    target: Chair
    approachPolicy: EmptyOrAssociatedSeat

- type: ksProcgenEntityPack
  id: KsProcgenOfficeWorkstations
  tags:
  - station
  - office
  activityTags:
  - officeWork
  compatibleSupportTags:
  - officeStorage
  assemblies:
  - id: Workstation
    assembly: KsProcgenOfficeWorkstationAssembly

- type: ksProcgenEntityPack
  id: KsProcgenOfficeStorage
  tags:
  - station
  - officeStorage
  entries:
  - id: WallLocker
    entity: ClosetWallGrey
    role: Storage

- type: ksProcgenRoomTheme
  id: KsProcgenSimpleOffice
  tags:
  - station
  - office
  tilePacks:
  - pack: KsProcgenOfficeTiles
  wallPacks:
  - pack: KsProcgenOfficeWalls
  lightingPacks:
  - pack: KsProcgenOfficeLights
  entityPacks:
  - pack: KsProcgenOfficeWorkstations
  - pack: KsProcgenOfficeStorage
  goals:
    coherentContents: true
    keepCenterOpen: true
    furnishingDensity: 0.2
    lightingCoverage: 0.85

- type: ksProcgenRoomTheme
  id: KsProcgenMandatoryOfficeFixture
  tilePacks:
  - pack: KsProcgenOfficeTiles
  wallPacks:
  - pack: KsProcgenOfficeWalls
  entityPacks:
  - pack: KsProcgenOfficeWorkstations
    minimumCount: 1

- type: ksProcgenRoomTheme
  id: KsProcgenNoDoorThemeFixture
  tilePacks:
  - pack: KsProcgenOfficeTiles
  wallPacks:
  - pack: KsProcgenNoDoorWallsFixture

- type: ksProcgenEntityPack
  id: KsProcgenLongTableFixture
  entries:
  - id: LongTable
    entity: Table
    role: PrimaryFurniture
    movement: VaultRequired
    footprint:
    - 0,0
    - 1,0

- type: ksProcgenRoomTheme
  id: KsProcgenLongTableThemeFixture
  tilePacks:
  - pack: KsProcgenOfficeTiles
  wallPacks:
  - pack: KsProcgenOfficeWalls
  lightingPacks:
  - pack: KsProcgenOfficeLights
  entityPacks:
  - pack: KsProcgenLongTableFixture
    minimumCount: 1

- type: ksProcgenEntityPack
  id: KsProcgenWideConsoleFixture
  entries:
  - id: WideConsole
    entity: ComputerAlert
    role: Equipment
    requiresInteractionApproach: true
    footprint:
    - 0,0
    - 1,0

- type: ksProcgenRoomTheme
  id: KsProcgenWideConsoleThemeFixture
  tilePacks:
  - pack: KsProcgenOfficeTiles
  wallPacks:
  - pack: KsProcgenOfficeWalls
  entityPacks:
  - pack: KsProcgenWideConsoleFixture
    minimumCount: 1
