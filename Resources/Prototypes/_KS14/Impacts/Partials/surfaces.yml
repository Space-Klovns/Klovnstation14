    material: Wood

- type: !PartialOnly entity
  id: KsBasePalletWooden
  components:
  - type: KsImpactSurface
    material: Wood

- type: !PartialOnly entity
  id: Bookshelf
  components:
  - type: KsImpactSurface
    material: Wood
  # Paper instead, with a chance of how full the shelf is: an empty one only throws wood.
  - type: KsImpactSurfaceStorageFill
    material: Paper

