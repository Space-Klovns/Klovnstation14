    material: Wood

- type: !PartialOnly entity
  id: BaseBarricade
  components:
  - type: KsImpactSurface
    material: Wood

- type: !PartialOnly entity
  id: BaseFenceWood
  components:
  - type: KsImpactSurface
    material: Wood

- type: !PartialOnly entity
  id: WoodDoor
  components:
