# Which surface throws what when shot (KsImpactSurface, Resources/Prototypes/_KS14/Impacts/materials.yml), after
# TGMC's add_debris_element() overrides. Children inherit their parent's and override it where listed below.

# DEBRIS_SPARKS: TGMC's walls, girders, metal barricades, shuttles.
- type: !PartialOnly entity
  id: BaseStructureWall
  components:
  - type: KsImpactSurface
    material: Metal

- type: !PartialOnly entity
  id: Girder
  components:
  - type: KsImpactSurface
    material: Metal

- type: !PartialOnly entity
  id: TableBase
  components:
  - type: KsImpactSurface
    material: Metal

- type: !PartialOnly entity
  id: CrateGeneric
  components:
  - type: KsImpactSurface
    material: Metal

- type: !PartialOnly entity
  id: BaseFenceMetal
  components:
  - type: KsImpactSurface
    material: Metal

