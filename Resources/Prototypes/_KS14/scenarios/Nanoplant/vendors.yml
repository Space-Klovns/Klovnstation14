- type: entity
  parent: ColMarTechScenarioBase
  id: ColMarTechScenarioNanoplantNt
  suffix: Nanoplant, Nanotrasen
  components:
  - type: CMAutomatedVendor
    sections:
    - name: Base Gear
      choices: { BaseGear: 1 }
      entries:
      - id: ScenarioVendorBundleNanoplantNtBase
        recommended: true
    - name: Loadout
      choices: { CMClass: 1 }
      entries:
      - id: ScenarioVendorBundleNanoplantNtRifleman
        recommended: true
        replaceSlot: &baseReplaceSlot [ shoes, idcard, gloves ]
      - id: ScenarioVendorBundleNanoplantNtEngineer
        replaceSlot: *baseReplaceSlot
      - id: ScenarioVendorBundleNanoplantNtMarksman
        replaceSlot: *baseReplaceSlot
