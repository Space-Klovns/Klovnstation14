- type: entity
  parent: ColMarTechScenarioBase
  id: ColMarTechScenarioTiderfallNt
  suffix: Tiderfall, Nanotrasen
  components:
  - type: Sprite
    sprite: _Crescent/Structures/syndicatearmory.rsi
  - type: CMAutomatedVendor
    sections:
    - name: Base Gear
      choices: { BaseGear: 1 }
      entries:
      - id: ScenarioVendorBundleTiderfallNtBase
        recommended: true
    - name: Loadout
      choices: { CMClass: 1 }
      entries:
      - id: ScenarioVendorBundleTiderfallNtSecurity
        recommended: true
      - id: ScenarioVendorBundleTiderfallNtTider
        replaceSlot: &baseReplaceSlot [ shoes, idcard, gloves ]
      - id: ScenarioVendorBundleTiderfallNtClown
        replaceSlot: *baseReplaceSlot
      - id: ScenarioVendorBundleTiderfallNtMiner
        replaceSlot: *baseReplaceSlot
      - id: ScenarioVendorBundleTiderfallNtConscript
        replaceSlot: *baseReplaceSlot
      - id: ScenarioVendorBundleTiderfallNtMedic
        replaceSlot: *baseReplaceSlot
      - id: ScenarioVendorBundleTiderfallNtBartender
        replaceSlot: *baseReplaceSlot

