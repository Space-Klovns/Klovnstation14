# Qi arts

- type: entity
  parent: BaseActionCultivation
  id: ActionMartialDragonPalm
  name: Eighteen Dragon-Subduing Palms
  description: A palm that hits like a charging dragon. Each palm on the same target within four seconds hits harder and throws them further; the fifth floors them. 15 qi.
  components:
  - type: CultivationArtCategory
    category: Offensive
  - type: Action
    useDelay: 1.5
    icon: { sprite: _KS14/Cultivation/actions.rsi, state: dragon_palm }
  - type: TargetAction
  - type: EntityTargetAction
    canTargetSelf: false
    whitelist:
      components:
      - MobState
    event: !type:DragonPalmActionEvent

- type: entity
  parent: BaseActionCultivation
  id: ActionMartialSixMeridians
  name: Six Meridians Divine Sword
  description: Fire sword qi from your fingertips. 10 qi.
  components:
  - type: CultivationArtCategory
    category: Offensive
  - type: Action
    useDelay: 1.5
    icon: { sprite: _KS14/Cultivation/actions.rsi, state: six_meridians }
  - type: TargetAction
    checkCanAccess: false
    range: 20
    repeat: true
  - type: WorldTargetAction
    event: !type:SixMeridiansActionEvent

- type: entity
  parent: BaseActionCultivation
  id: ActionMartialNorthernDarkness
  name: Northern Darkness Divine Skill
  description: Drink in another's qi as the sea takes in rivers. A mortal, with no qi to give, is drained of strength instead.
  components:
  - type: CultivationArtCategory
    category: Offensive
  - type: Action
    useDelay: 15
    icon: { sprite: _KS14/Cultivation/actions.rsi, state: northern_darkness }
  - type: TargetAction
  - type: EntityTargetAction
    canTargetSelf: false
    whitelist:
      components:
      - MobState
    event: !type:NorthernDarknessActionEvent

- type: entity
  parent: BaseActionCultivation
  id: ActionMartialStarAbsorbing
  name: Star-Absorbing Great Method
  description: A dark art. Tear away another's qi and insight and heal yourself on it. Stolen qi sometimes fights back.
  components:
  - type: CultivationArtCategory
    category: Offensive
  - type: Action
    useDelay: 20
    icon: { sprite: _KS14/Cultivation/actions.rsi, state: star_absorbing }
  - type: TargetAction
  - type: EntityTargetAction
    canTargetSelf: false
    whitelist:
      components:
      - MobState
    event: !type:StarAbsorbingActionEvent

- type: entity
  parent: BaseActionCultivation
  id: ActionMartialGreatShift
  name: Great Shift of Heaven and Earth
  description: For six seconds, turn up to three projectiles back on whoever loosed them. 30 qi.
  components:
  - type: CultivationArtCategory
    category: Defensive
  - type: Action
    useDelay: 25
    icon: { sprite: _KS14/Cultivation/actions.rsi, state: great_shift }
  - type: InstantAction
    event: !type:GreatShiftActionEvent

# Body arts

- type: entity
  parent: BaseActionCultivation
  id: ActionMartialGoldenBell
  name: Golden Bell Shield
  description: Harden your skin for ten seconds, turning aside two fifths of every physical blow. Costs stamina.
  components:
  - type: CultivationArtCategory
    category: Defensive
  - type: Action
    useDelay: 25
    icon: { sprite: _KS14/Cultivation/actions.rsi, state: golden_bell }
  - type: InstantAction
    event: !type:GoldenBellActionEvent

- type: entity
  parent: BaseActionCultivation
  id: ActionMartialGracefulSteps
  name: Graceful Waves Steps
  description: Light, quick footwork for eight seconds. Costs stamina.
  components:
  - type: CultivationArtCategory
    category: Mobility
  - type: Action
    useDelay: 20
    icon: { sprite: _KS14/Cultivation/actions.rsi, state: graceful_steps }
  - type: InstantAction
    event: !type:GracefulStepsActionEvent

- type: entity
  parent: BaseActionCultivation
  id: ActionMartialLadderCloud
  name: Ladder-Cloud Leap
  description: Spring off the air itself and land up to five tiles away. Costs stamina.
  components:
  - type: CultivationArtCategory
    category: Mobility
  - type: Action
    useDelay: 12
    icon: { sprite: _KS14/Cultivation/actions.rsi, state: ladder_cloud }
  - type: TargetAction
    checkCanAccess: false
    range: 6
  - type: WorldTargetAction
    event: !type:LadderCloudLeapActionEvent

- type: entity
  parent: BaseActionCultivation
  id: ActionMartialDuguCounter
  name: Nine Swords of Dugu
  description: For three seconds, read the next blow from someone close. It never lands, and they are cut and knocked down. Costs stamina.
  components:
  - type: CultivationArtCategory
    category: Defensive
  - type: Action
    useDelay: 15
    icon: { sprite: _KS14/Cultivation/actions.rsi, state: dugu_counter }
  - type: InstantAction
    event: !type:DuguCounterActionEvent

- type: entity
  parent: BaseActionCultivation
  id: ActionWuxiaRecallTeachings
  name: Recall Teachings
  description: Remember the combos of your fighting style. Punch, shove and grab the same opponent in the right order to land them.
  components:
  - type: CultivationArtCategory
    category: Utility
  - type: Action
    useDelay: 1
    icon: { sprite: _KS14/Cultivation/actions.rsi, state: recall_teachings }
  - type: InstantAction
    event: !type:RecallTeachingsActionEvent
