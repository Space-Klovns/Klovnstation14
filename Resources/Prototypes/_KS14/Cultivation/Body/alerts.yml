- type: alert
  id: KsBodyExhaustion
  icons:
  - sprite: /Textures/_KS14/Cultivation/body_exhaustion.rsi
    state: base
  alertViewEntity: AlertKsBodyExhaustionSpriteView
  name: alerts-ks-body-exhaustion-name
  description: alerts-ks-body-exhaustion-desc

- type: entity
  id: AlertKsBodyExhaustionSpriteView
  categories: [ HideSpawnMenu ]
  components:
  - type: GenericCounterAlert
    centerGlyph: false
    hideLeadingZeroes: false
  - type: Sprite
    sprite: /Textures/_KS14/Cultivation/body_exhaustion.rsi
    layers:
    - map: [ "enum.AlertVisualLayers.Base" ]
    - map: [ "1" ]
      offset: 0.25, -0.125
    - map: [ "10" ]
      offset: 0.125, -0.125
    - map: [ "100" ]
      offset: 0, -0.125

