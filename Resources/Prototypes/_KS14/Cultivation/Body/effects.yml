# Ripples the air out from the impact, using the explosion shockwave shader.
- type: entity
  id: KsBodyShockwave
  categories: [ HideSpawnMenu ]
  name: shockwave
  components:
  - type: KsShockwave
    falloffPower: 30
    sharpness: 8
    width: 0.9
  - type: TimedDespawn
    lifetime: 1.5

- type: entity
  id: KsBodyDust
  categories: [ HideSpawnMenu ]
  name: dust
  description: A cloud of pulverised floor.
  components:
  - type: Sprite
    sprite: Effects/chemsmoke.rsi
    state: chemsmoke
    color: "#8a7f72aa"
    drawdepth: Effects
  - type: TimedDespawn
    lifetime: 1.2

# Fire for show: it lights the room and flickers out. What actually burns is up to the technique.
# Real fire, the same flames a burning room shows, in three sizes; fire techniques are built from these.
- type: entity
  id: KsFxFlameBig
  categories: [ HideSpawnMenu ]
  name: flame
  components:
  - type: Sprite
    sprite: _KS14/Cultivation/flames_big.rsi
    drawdepth: Effects
    noRot: true
    offset: 0, 0.25
    layers:
    - state: flame_big
      shader: unshaded
  - type: PointLight
    color: "#ff7a1e"
    radius: 4
    energy: 4
    netsync: false
  - type: LightFade
    duration: 2.4
  - type: TimedDespawn
    lifetime: 2.4
  - type: Tag
    tags:
    - HideContextMenu

- type: entity
  id: KsFxFlameSmall
  categories: [ HideSpawnMenu ]
  name: flame
  components:
  - type: Sprite
    sprite: _KS14/Cultivation/flames.rsi
    drawdepth: Effects
    noRot: true
    layers:
    - state: flame_small
      shader: unshaded
  - type: PointLight
    color: "#ff9a3a"
    radius: 2
    energy: 2
    netsync: false
  - type: LightFade
    duration: 1.6
  - type: TimedDespawn
    lifetime: 1.6
  - type: Tag
    tags:
    - HideContextMenu

- type: entity
  id: KsFxFlame
  categories: [ HideSpawnMenu ]
  name: flame
  components:
  - type: Sprite
    sprite: _KS14/Cultivation/flames.rsi
