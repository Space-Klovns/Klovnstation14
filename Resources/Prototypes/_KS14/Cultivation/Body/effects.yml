# Bend the picture around a point for a moment, like the air round a singularity.
- type: entity
  id: KsFxDistortionPush
  categories: [ HideSpawnMenu ]
  name: distortion
  components:
  - type: SingularityDistortion
    intensity: -60
    falloffPower: 2.2
  - type: TimedDespawn
    lifetime: 0.6
  - type: Tag
    tags:
    - HideContextMenu

