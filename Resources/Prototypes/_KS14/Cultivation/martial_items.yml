# Legendary armor

- type: entity
  parent: ClothingOuterBase
  id: ClothingOuterSoftHedgehogArmor
  name: soft hedgehog armor
  description: A supple vest of black silk lined with barbs. Whoever strikes its wearer up close is pricked bloody.
  components:
  - type: Sprite
    sprite: _KS14/Cultivation/soft_hedgehog_armor.rsi
  - type: Clothing
    sprite: _KS14/Cultivation/soft_hedgehog_armor.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.8
        Slash: 0.7
        Piercing: 0.8
  - type: SoftHedgehogArmor

- type: entity
  parent: ClothingOuterBase
  id: ClothingOuterGoldenSilkVest
  name: golden silk vest
  description: A treasure vest woven from golden silk, light as cloth and almost impossible to cut or pierce.
  components:
  - type: Sprite
    sprite: _KS14/Cultivation/golden_silk_vest.rsi
  - type: Clothing
    sprite: _KS14/Cultivation/golden_silk_vest.rsi
  - type: Armor
    modifiers:
      coefficients:
        Slash: 0.4
        Piercing: 0.5
        Blunt: 0.9

# The Great Sage's regalia, given by the Dragon Kings of the Four Seas. Wear all three to wake the set.

- type: entity
  parent: ClothingOuterBase
  id: ClothingOuterGoldenChainMail
  name: golden chain-mail
  description: Fish-scale mail of red gold between black lacquered plates, with a heart-protecting mirror on either breast. Part of the Great Sage's regalia.
  components:
  - type: Sprite
    sprite: _KS14/Cultivation/golden_chain_mail.rsi
  - type: Clothing
    sprite: _KS14/Cultivation/golden_chain_mail.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.6
        Slash: 0.6
        Piercing: 0.6
        Heat: 0.75
  - type: ClothingSpeedModifier
    walkModifier: 0.95
    sprintModifier: 0.95
  - type: GreatSageRegalia

- type: entity
  parent: ClothingHeadBase
  id: ClothingHeadPhoenixWingCrown
  name: phoenix-wing purple-gold crown
  description: A purple cap under a band of gold, crowned with two long pheasant plumes. Part of the Great Sage's regalia.
