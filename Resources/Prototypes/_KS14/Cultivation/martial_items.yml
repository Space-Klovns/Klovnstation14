  - type: Clothing
    sprite: _KS14/Cultivation/phoenix_crown.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.85
        Slash: 0.85
  - type: GreatSageRegalia

- type: entity
  parent: ClothingShoesBase
  id: ClothingShoesCloudStepping
  name: lotus-silk cloud-stepping boots
  description: Boots of lotus-root silk with upturned cloud toes. The wearer never slips and seems to walk on air. Part of the Great Sage's regalia.
  components:
