# Effects ported from the SurfShack13 cultivation sprites. Their SS13 animations (the falling palm, the rift snapping
# open, the flying rubble) are baked into the frames; an animated state loops,
# so each one despawns as its single run ends.

# Buddha's Palm: drawn at native size on a tall canvas whose landing point sits 80 pixels below its centre, so each size
# offsets it by 80 * scale / 32 tiles to land on the tile it was called down on. It hits the floor 1.2 seconds in.
- type: entity
  id: KsFxBuddhaPalm
  categories: [ HideSpawnMenu ]
  name: Buddha's palm
  description: A colossal golden palm, falling from the heavens.
  components:
  - type: Sprite
    sprite: _KS14/Cultivation/buddha_palm.rsi
    drawdepth: Overdoors
    noRot: true
    layers:
    - state: palm
      shader: unshaded
      scale: 1.6, 1.6
      offset: 0, 4
  - type: PointLight
    color: "#ffd55a"
    radius: 6
    energy: 3
    netsync: false
  - type: TimedDespawn
    lifetime: 2.4

- type: entity
  parent: KsFxBuddhaPalm
  id: KsFxBuddhaPalmBig
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    layers:
    - state: palm
      shader: unshaded
      scale: 2.4, 2.4
      offset: 0, 6
  - type: PointLight
    color: "#ffd55a"
    radius: 9
    energy: 4

- type: entity
  parent: KsFxBuddhaPalm
  id: KsFxBuddhaPalmHuge
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    layers:
    - state: palm
      shader: unshaded
      scale: 3.2, 3.2
      offset: 0, 8
  - type: PointLight
    color: "#ffd55a"
    radius: 12
    energy: 5

