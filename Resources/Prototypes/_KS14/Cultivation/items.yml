- type: entity
  abstract: true
  parent: BaseItem
  id: BaseCultivationManual
  description: A hand-bound manual, its pages dense with meridian charts and cryptic verses. Only a cultivator could make sense of it.
  components:
  - type: Item
    size: Small

- type: entity
  parent: BaseCultivationManual
  id: CultivationManualMetal
  name: Golden Edge Sutra
  components:
  - type: Sprite
    sprite: _KS14/Cultivation/manuals.rsi
    state: manual_metal
  - type: CultivationManual
    law: KsMetal

- type: entity
