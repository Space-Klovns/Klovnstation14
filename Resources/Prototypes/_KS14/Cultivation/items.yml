- type: entity
  parent: BaseBullet
  id: ProjectileCultivationBubble
  categories: [ HideSpawnMenu ]
  name: water bubble
  description: A wobbling bubble of water, drifting slowly. Don't let it catch you.
  components:
  - type: Sprite
    sprite: _KS14/Cultivation/wuxia_64.rsi
    noRot: true
    scale: 0.45,0.45
    layers:
    - state: water_bubble
      shader: unshaded
      color: "#ffffffdd"
  - type: PointLight
    color: "#5ab8ff"
    radius: 2.5
    energy: 1.5
  - type: Projectile
    impactEffect: KsFxSwordQiImpact
    damage:
      types:
        Blunt: 2
  - type: TimedDespawn
    lifetime: 2

- type: entity
  parent: BaseBullet
  id: ProjectileCultivationSwordQi
  categories: [ HideSpawnMenu ]
  name: sword qi
  components:
  - type: Sprite
    sprite: _KS14/Cultivation/wuxia_32.rsi
    layers:
    - state: sword_qi
      shader: unshaded
  - type: PointLight
    color: "#d8f0ff"
    radius: 1.5
    energy: 1.5
  - type: Projectile
    impactEffect: KsFxSwordQiImpact
    damage:
      types:
        Slash: 15
  - type: TimedDespawn
    lifetime: 2
