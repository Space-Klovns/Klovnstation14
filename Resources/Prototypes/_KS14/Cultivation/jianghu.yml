# The jianghu, the martial world: face and honor duels.

- type: entity
  parent: BaseActionCultivation
  id: ActionJianghuDuel
  name: Challenge to Duel
  description: Formally challenge someone nearby to an honor duel. The winner gains face and the loser loses it, anyone watching learns from it, and anyone who interferes is disgraced. Lasts until someone is beaten, yields, flees, or three minutes pass. Each side can wager what they hold, and the winner takes every stake.
  components:
  - type: Action
    useDelay: 30
    icon: { sprite: _KS14/Cultivation/actions.rsi, state: duel }
  - type: TargetAction
    range: 4
  - type: EntityTargetAction
    canTargetSelf: false
    whitelist:
      components:
      - MobState
    event: !type:ChallengeDuelActionEvent

- type: entity
  parent: BaseActionCultivation
  id: ActionJianghuYield
  name: Yield
  description: Concede the honor duel. You lose a little face, but keep your teeth.
  components:
  - type: Action
    icon: { sprite: _KS14/Cultivation/actions.rsi, state: yield }
  - type: InstantAction
    event: !type:YieldDuelActionEvent
