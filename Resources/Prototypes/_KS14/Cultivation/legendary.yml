    controls: legendary-dragon-blade-controls
  - type: LegendaryTreasureHit
  - type: GreenDragonBlade

- type: entity
  parent: KsLegendaryBase
  id: KsSevenStarSword
  name: Seven-Star Sword
  description: A dark jian inlaid with seven golden studs in the shape of the Northern Dipper. Each one glows a little brighter with every blow.
  components:
  - type: Clothing
    # Carried like a sword: at the hip, slung across the back, or in a vest's storage slot. Too long for a backpack.
