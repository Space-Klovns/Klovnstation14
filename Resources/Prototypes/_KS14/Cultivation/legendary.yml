  - type: Sprite
    sprite: _KS14/Cultivation/legendary.rsi
    state: seven_star_sword
  - type: Item
    size: Large
    sprite: Objects/Weapons/Melee/katana.rsi
  - type: MeleeWeapon
    damage:
      types:
        Slash: 20
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: PointLight
    color: "#ffe27a"
    radius: 1.5
    energy: 0
  - type: LegendaryArtifact
    legend: legendary-seven-star-legend
    power: legendary-seven-star-power
    controls: legendary-seven-star-controls
  - type: LegendaryTreasureHit
  - type: SevenStarSword
  - type: ActionGrant
    actions:
    - ActionKsSevenStars
  - type: ItemActionGrant
    actions:
    - ActionKsSevenStars

- type: entity
  parent: KsLegendaryBase
  id: KsLinglongPagoda
  name: Linglong Pagoda
  description: A small golden pagoda of seven exquisite tiers, cool and heavy in the hand. Something about its doors makes you not want to look too closely.
  components:
  - type: Sprite
    sprite: _KS14/Cultivation/legendary.rsi
    state: linglong_pagoda
  - type: Item
    size: Small
  - type: LegendaryArtifact
    legend: legendary-pagoda-legend
    power: legendary-pagoda-power
    controls: legendary-pagoda-controls
  - type: LinglongPagoda
  - type: ContainerContainer
    containers:
      ks-pagoda: !type:ContainerSlot

- type: entity
  parent: KsLegendaryBase
  id: KsUniverseRing
  name: Universe Ring
  description: A heavy golden bracelet, as wide as a palm. It hums when it's thrown, and it always knows its way home.
  components:
  - type: Sprite
    sprite: _KS14/Cultivation/legendary.rsi
    state: universe_ring
  - type: Item
    size: Small
  - type: LegendaryArtifact
    legend: legendary-universe-ring-legend
    power: legendary-universe-ring-power
    controls: legendary-universe-ring-controls
  - type: UniverseRing

- type: entity
  parent: ClothingShoesBase
  id: KsWindFireWheels
  name: Wind Fire Wheels
  description: A pair of spinning wheels wreathed in flame, worn on the feet. They want to go fast. They do not want to stop.
  components:
  - type: Sprite
    sprite: _KS14/Cultivation/legendary.rsi
    state: wind_fire_wheels
  - type: Clothing
    sprite: Clothing/Shoes/Boots/combatboots.rsi
  - type: ClothingSpeedModifier
    walkModifier: 1.5
    sprintModifier: 1.5
  - type: NoSlip
  - type: PointLight
    color: "#ff7a2c"
    radius: 1.5
    energy: 1
  - type: LegendaryArtifact
    legend: legendary-wheels-legend
    power: legendary-wheels-power
    controls: legendary-wheels-controls
  - type: WindFireWheels

- type: entity
  parent: BaseActionCultivation
  id: ActionKsSevenStars
  name: Seven Stars of the Northern Dipper
  description: Release the lit stars (three or more) to fall in the shape of the Northern Dipper where you aim. With all seven, the last is a great star that knocks everyone around it down.
  components:
  - type: Action
    useDelay: 2
    icon: { sprite: _KS14/Cultivation/legendary.rsi, state: seven_star_sword }
  - type: TargetAction
    checkCanAccess: false
    range: 10
  - type: WorldTargetAction
    event: !type:SevenStarsActionEvent
