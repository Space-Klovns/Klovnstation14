# Element effects built from the game's own sprites (the extinguisher's spray, chemical puffs and smoke, gas, sparks),
# tinted for each element. See CultivationVisualsSystem.WaterSplash, WoodBloom, MetalSparks and Mist.

- type: entity
  id: KsFxWaterSpray
  categories: [ HideSpawnMenu ]
  name: water
  components:
  - type: Sprite
    sprite: _KS14/Cultivation/elements.rsi
    drawdepth: Effects
    noRot: true
    layers:
    - state: splash
      shader: unshaded
  - type: PointLight
    color: "#6fc0ff"
    radius: 1.5
    energy: 1.2
    netsync: false
  - type: LightFade
    duration: 0.64
  - type: TimedDespawn
    lifetime: 0.64
  - type: Tag
    tags:
    - HideContextMenu

- type: entity
  id: KsFxWaterPuff
  categories: [ HideSpawnMenu ]
