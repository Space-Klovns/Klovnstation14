    icon: { sprite: _KS14/Cultivation/actions.rsi, state: category_mobility }
  - type: InstantAction
    event: !type:CultivationArtsMenuActionEvent
      category: Mobility
  - type: AlwaysOnBar

# One of the four category menus: opens at the mouse with every art of this kind the user knows; picking one uses it.
- type: entity
  parent: BaseActionCultivation
  id: ActionKsArtsUtility
  name: Utility Arts
  description: 'Everything else you know: arrays, talismans, the jianghu, teaching, and your favourites. Opens at your mouse; pick one to use it. Bind this button to a key for quick access.'
  components:
  - type: Action
    clientExclusive: true
    checkCanInteract: false
    priority: -5
    icon: { sprite: _KS14/Cultivation/actions.rsi, state: category_utility }
