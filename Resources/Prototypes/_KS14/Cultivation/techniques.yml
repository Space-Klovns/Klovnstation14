# Opens the radial menu of every technique the cultivator knows; only a handful are equipped at once.
- type: entity
  parent: BaseActionCultivation
  id: ActionKsTechniques
  name: Favourites
  description: Choose which of your techniques, arts and jianghu actions also sit on your action bar, where they can be bound to keys. Everything you know is always in its category menu; only a few can be kept on the bar at once.
  components:
  - type: Action
    useDelay: 1
    icon: { sprite: _KS14/Cultivation/actions.rsi, state: recall_teachings }
  - type: InstantAction
    event: !type:TechniqueMenuActionEvent

# One of the four category menus: opens at the mouse with every art of this kind the user knows; picking one uses it.
- type: entity
  parent: BaseActionCultivation
  id: ActionKsArtsOffensive
  name: Offensive Arts
  description: 'Everything you know for attacking: strikes, blasts, holds and curses. Opens at your mouse; pick one to use it. Bind this button to a key for quick access.'
  components:
  - type: Action
    clientExclusive: true
    checkCanInteract: false
    priority: -8
    icon: { sprite: _KS14/Cultivation/actions.rsi, state: category_offensive }
  - type: InstantAction
    event: !type:CultivationArtsMenuActionEvent
      category: Offensive
  - type: AlwaysOnBar

# One of the four category menus: opens at the mouse with every art of this kind the user knows; picking one uses it.
- type: entity
  parent: BaseActionCultivation
  id: ActionKsArtsDefensive
  name: Defensive Arts
  description: 'Everything you know for protecting yourself and others: wards, heals, counters and hardening. Opens at your mouse; pick one to use it. Bind this button to a key for quick access.'
  components:
  - type: Action
    clientExclusive: true
    checkCanInteract: false
    priority: -7
    icon: { sprite: _KS14/Cultivation/actions.rsi, state: category_defensive }
  - type: InstantAction
    event: !type:CultivationArtsMenuActionEvent
      category: Defensive
  - type: AlwaysOnBar

# One of the four category menus: opens at the mouse with every art of this kind the user knows; picking one uses it.
- type: entity
  parent: BaseActionCultivation
  id: ActionKsArtsMobility
  name: Movement Arts
  description: 'Everything you know for moving: dashes, leaps, flight and escapes. Opens at your mouse; pick one to use it. Bind this button to a key for quick access.'
  components:
  - type: Action
    clientExclusive: true
    checkCanInteract: false
