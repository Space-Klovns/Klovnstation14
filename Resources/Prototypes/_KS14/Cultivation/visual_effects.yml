# Glowing cultivation effects in every element colour (qi_effects.rsi).
# Glowing cultivation effects, one per element colour. Bursts (waves, sparks, motes) fade out on their own;
# auras, domes and sigils follow a cultivator until CultivationVisualsSystem removes them.

- type: entity
  id: KsFxWaveQi
  categories: [ HideSpawnMenu ]
  name: wave
  components:
  - type: Sprite
    sprite: _KS14/Cultivation/qi_effects.rsi
    drawdepth: Effects
    noRot: true
    color: "#9fe3ffff"
    layers:
    - state: wave
      shader: unshaded
    scale: 1.5, 1.5
  - type: PointLight
    color: "#9fe3ff"
    radius: 3.0
    energy: 2.5
    netsync: false
  - type: LightFade
    duration: 0.48
