- type: entity
  id: KsFxSlashGanjiang
  categories: [ HideSpawnMenu ]
  name: slash
  components:
  - type: Sprite
    sprite: Effects/arcs.rsi
    drawdepth: Effects
    noRot: false
    scale: 1.2, 1.2
    layers:
    - state: slash
      shader: unshaded
      color: "#7aa6ffff"
  - type: PointLight
    color: "#5a8cff"
    radius: 1.8
    energy: 2
    netsync: false
  - type: LightFade
    duration: 0.35
  - type: TimedDespawn
    lifetime: 0.35
  - type: Tag
    tags:
    - HideContextMenu

