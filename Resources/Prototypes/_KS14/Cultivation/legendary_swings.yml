# The legendary weapons' swings. The game swings the weapon's own sprite along these arcs; each carries a light in the
# weapon's colour, and LegendarySwing throws sparks of that colour (a puff of gold dust for the staff) off whatever it hits.

- type: entity
  parent: WeaponArcStatic
  id: KsWeaponArcGanjiang
  categories: [ HideSpawnMenu ]
  components:
  - type: WeaponArcVisuals
    animation: Slash
  - type: PointLight
    color: "#5a8cff"
    radius: 2.2
    energy: 2.5
    netsync: false

- type: entity
  parent: WeaponArcStatic
  id: KsWeaponArcGanjiangThrust
  categories: [ HideSpawnMenu ]
