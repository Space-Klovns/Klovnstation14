- type: entity
  id: KsFxSlashGanjiang
  categories: [ HideSpawnMenu ]
  name: hit
  components:
  - type: Sprite
    sprite: _KS14/Cultivation/elements.rsi
    drawdepth: Effects
    noRot: true
    layers:
    - state: slash
      shader: unshaded
      color: "#9fc0ffff"
  - type: PointLight
    color: "#5a8cff"
    radius: 1.6
    energy: 2
    netsync: false
