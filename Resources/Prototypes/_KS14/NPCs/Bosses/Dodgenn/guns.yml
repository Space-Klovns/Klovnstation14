# Dodgenn guns, shared by both phases: whatever gun is in hand gets racked, wielded and shot. Phase one spawns a pistol
#   into its hand; phase two summons a rocket launcher and picks it up off the ground (DodgennNearbyGuns only finds
#   launchers). The launcher's lines play only with a launcher in hand.

- type: htnCompound
  id: DodgennRangedCombatCompound
  branches:
  ## Close or rack the gun chamber if necessary.
  - preconditions:
    - !type:ActiveHandComponentPrecondition
      components:
      - type: Gun
    - !type:GunAmmoPrecondition
      minPercent: 0.001
    - !type:NeedToRackBoltPrecondition
    tasks:
    - !type:HTNPrimitiveTask
      operator: !type:RackBoltOperator

  ## Wield the gun.
  - preconditions:
    - !type:ActiveHandComponentPrecondition
      components:
      - type: Gun
    - !type:WieldedPrecondition
      wielded: false
    tasks:
    - !type:HTNPrimitiveTask
      operator: !type:WieldOperator

  ## Move to the target and shoot it, while there is ammo.
  - preconditions:
    - !type:GunAmmoPrecondition
      minPercent: 0.001
    tasks:
    - !type:HTNCompoundTask
      task: DodgennGunCombatCompound

  ## Pick up a gun with ammo, with none in hand.
  - preconditions:
    - !type:ActiveHandComponentPrecondition
      components:
      - type: Gun
      invert: true
    tasks:
    - !type:HTNCompoundTask
      task: DodgennPickupGunCompound

  ## Drop the gun once it is empty.
  - preconditions:
    - !type:ActiveHandComponentPrecondition
      components:
      - type: Gun
    - !type:GunAmmoPrecondition
      maxPercent: 0.001
    tasks:
    - !type:HTNPrimitiveTask
      preconditions:
      - !type:ActiveHandEntityPrecondition
      operator: !type:DropOperator

# Shoots a target at range.
- type: htnCompound
  id: DodgennGunCombatCompound
  branches:
  - tasks:
    - !type:HTNPrimitiveTask
      operator: !type:MoveToOperator
        shutdownState: PlanFinished
        pathfindInPlanning: true
        removeKeyOnFinish: false
        targetKey: TargetCoordinates
        pathfindKey: TargetPathfind
        stopOnLineOfSight: true
        rangeKey: RangedRange

    - !type:HTNPrimitiveTask
      operator: !type:JukeOperator
        jukeType: Away

    - !type:HTNCompoundTask
      task: DodgennGunFluffCompound

    - !type:HTNPrimitiveTask
      preconditions:
      - !type:KeyExistsPrecondition
        key: Target
      operator: !type:GunOperator
        targetKey: Target
      services:
      - !type:UtilityService
        id: RangedService
        proto: NearbyGunTargets
        key: Target

# Showing off before a shot.
- type: htnCompound
  id: DodgennGunFluffCompound
  branches:
  ## Launcher - the end draws nigh, a pause, a flip, and a dash at the target.
  - preconditions:
    - !type:ActiveHandComponentPrecondition
      components:
      - type: GunBackblast
        radius: 0
    tasks:
    - !type:HTNPrimitiveTask # VOICELINE
      operator: !type:PlaySoundOperator
        sound:
          collection: KsDodgennTalkUseLauncher
    - !type:HTNPrimitiveTask
      operator: !type:SpeakOperator
        speech: !type:SingleSpeakOperatorSpeech
          line: "THE END DRAWS NIGH!!!"
        hidden: false
    - !type:HTNPrimitiveTask # a moment to react to the line before it fires
      operator: !type:StaticWaitOperator
        key: DodgennLauncherWindup
    - !type:HTNPrimitiveTask
      operator: !type:EmoteOperator
        id: Flip
        hidden: false
    - !type:HTNPrimitiveTask
      operator: !type:DoWorldActionOperator
        id: KsActionDodgennBossDash
        targetCoordinatesKey: TargetCoordinates

  ## Anything else - no fuss.
  - tasks:
    - !type:HTNPrimitiveTask
      operator: !type:NoOperator

- type: htnCompound
  id: DodgennPickupGunCompound
  branches:
  - tasks:
    - !type:HTNPrimitiveTask
      operator: !type:UtilityOperator
        proto: DodgennNearbyGuns

    - !type:HTNPrimitiveTask
      operator: !type:MoveToOperator

    - !type:HTNPrimitiveTask
      preconditions:
      - !type:ActiveHandFreePrecondition
      - !type:TargetInRangePrecondition
        targetKey: Target
        rangeKey: InteractRange
      operator: !type:InteractWithOperator
        targetKey: Target
