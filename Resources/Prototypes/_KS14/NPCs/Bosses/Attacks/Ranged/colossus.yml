# Lament - 8 bursts, 4 projectiles per burst (cardinal directions)
- type: entity
  id: ColossusDirectionalAttack
  parent: RangedCardinalDirections
  components:
  - type: NpcRangedAttackPattern
    projectile: ColossusDeathBolt
    telegraphSpriteFlickData:
      layerKey: base
      flickState: attack
    sound:
      path: /Audio/_KS14/Effects/Magic/ratvar_attack.ogg
    burstCount: 45
    shots: 4
    shotDelay: 0.3
    cooldown: 3.0

