- type: entity
  abstract: true
  id: BaseNPCRanged
  categories: [ NpcAttackPattern ]
  components:
  - type: NpcRangedAttackPattern
    shots: 1
    degreesPerShot: 15 # Added degree per shot for next shot
    rotationOffset: 0
    spread: 45 # Spread for attacks with more than 1 shot
    speed: 5 # Projectile speed
    cooldown: 20.0 # Cooldown time in seconds
    # Sound can be specified in inheriting entities

# Templates for each pattern, abstract: what they fire is up to whatever inherits them.
- type: entity
  abstract: true
  parent: BaseNPCRanged
  id: RangedSpiral
  name: spiral attack
  components:
  - type: NpcRangedAttackPattern
    attackType: Spiral
    shots: 24
    degreesPerShot: 15

- type: entity
  abstract: true
  parent: BaseNPCRanged
  id: RangedDoubleSpiral
  name: double spiral attack
  components:
  - type: NpcRangedAttackPattern
    attackType: DoubleSpiral
    shots: 24
    degreesPerShot: 15
    rotationOffset: 180

- type: entity
  abstract: true
  parent: BaseNPCRanged
  id: RangedShotgun
  name: shotgun blast
  components:
  - type: NpcRangedAttackPattern
