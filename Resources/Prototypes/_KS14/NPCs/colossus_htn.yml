- type: utilityQuery
  id: ColossusTargets
  query:
    - !type:NearbyHostilesQuery
  considerations:
    - !type:TargetIsAliveCon
      curve: !type:BoolCurve
    - !type:TargetDistanceCon
      curve: !type:PresetCurve
        preset: TargetDistance
    - !type:TargetInLOSOrCurrentCon
      curve: !type:BoolCurve
# doesnt work yet

# Main compound
- type: htnCompound
  id: ColossusCompound
  branches:
    # Find target and fight
    - tasks:
        - !type:HTNPrimitiveTask
          operator: !type:RangedTargetingOperator
            key: Target
            aggroKey: Aggroed
            radiusKey: VisionRadius
            aggroRadiusKey: AggroVisionRadius
        - !type:HTNCompoundTask
          task: ColossusFightCompound
    # No target - idle
    - tasks:
        - !type:HTNCompoundTask
          task: IdleCompound

- type: htnCompound
  id: ColossusFightCompound
  branches:
    - preconditions:
        - !type:KeyExistsPrecondition
          key: Target
      tasks:
        - !type:HTNCompoundTask
          task: ColossusAttackTargetCompound
        - !type:HTNPrimitiveTask
          operator: !type:UtilityOperator
            proto: ColossusTargets
        - !type:HTNPrimitiveTask
          operator: !type:MoveToOperator
            shutdownState: PlanFinished
            pathfindInPlanning: false
            removeKeyOnFinish: false
            targetKey: TargetCoordinates
            pathfindKey: TargetPathfind
            rangeKey: RangedRange
    - tasks:
        - !type:HTNCompoundTask
          task: IdleCompound

# Attack compound - handles all attacks
- type: htnCompound
  id: ColossusAttackTargetCompound
  branches:
    # DIE - final attack at low health (only once)
    - preconditions:
        - !type:KeyExistsPrecondition
          key: Target
        - !type:DamageThresholdPrecondition
          damageThreshold: 2250
          checkAnyType: false
        - !type:KeyNotExistsPrecondition
          key: ColossusFinalUsed
      tasks:
        - !type:HTNPrimitiveTask
          operator: !type:RangedOperator
            attackId: "enragedSpiral"
            speech: "DIE."
            executedFlagKey: ColossusFinalUsed


    # Normal attacks - weighted pick in one operator
    - tasks:
        - !type:HTNPrimitiveTask
          operator: !type:WeightedRangedOperator
            weights:
              spiral: 20
              randomAoe: 20
              shotgun: 40
              directional: 20
            speeches:
              spiral: "Judgement."
              randomAoe: "Wrath."
              shotgun: "Retribution."
              directional: "Lament."
            angerWeights:
              shotgun: 2
            useAngerModifier: true

