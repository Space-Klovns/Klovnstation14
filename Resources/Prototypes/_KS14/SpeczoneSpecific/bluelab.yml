- type: accessLevel
  id: Bluelab
  name: id-card-access-level-bluelab
  canAddToIdCard: false

- type: entity
  parent: IDCardStandard
  id: BluelabIDCard
  name: laboratory ID card
  components:
  - type: Sprite
    layers:
    - state: centcom
    - state: stripe_top
      color: "#134975"
    - state: stripe_bottom
      color: "#0d304d"
    - sprite: Interface/Misc/job_icons.rsi
      offset: -0.09375, 0.0625
      state: Nanotrasen
  - type: Item
    heldPrefix: blue
  - type: Access
    tags:
    - Bluelab
  - type: IdCard
    jobIcon: JobIconNanotrasen
    jobTitle: job-name-bluelab
    canMicrowave: false

- type: entity
  parent: DoorElectronics
  id: DoorElectronicsLabs
  suffix: Labs, Locked
  components:
  - type: AccessReader
    access: [["Bluelab"]]

- type: entity
  parent: AirlockLabsUnpryable
  id: AirlockLabsUnpryableBluelabLocked
  suffix: Labs, Locked, Unpryable
  components:
  - type: ContainerFill
    containers:
      board: [ DoorElectronicsLabs ]

- type: entity
  parent: MarkerBase
  id: KsChasmIconsmoother
  name: iconsmooth marker
  suffix: KS14, Iconsmooth Marker, Chasm
  components:
  - type: Sprite
    layers:
    - state: blue
  - type: IconSmooth
    key: chasm
    mode: NoSprite

- type: entity
  parent: MarkerBase
  id: KsCatwalkIconsmoother
  name: iconsmooth marker
  suffix: KS14, Iconsmooth Marker, Catwalk
  components:
  - type: Sprite
    layers:
    - state: green
  - type: IconSmooth
    key: catwalk
    mode: NoSprite

- type: entity
  parent: MarkerBase
  id: BluelabSpookyAmbienceTagMarker
  name: spooky ambience
  suffix: Labs, Spooky Ambience
  components:
  - type: Sprite
    layers:
    - state: red
  - type: Tag
    tags:
    - SpookyFog
