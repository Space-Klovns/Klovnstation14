# NT Paramilitary's voice: the same moments as the standard operative lines, said colder - designations, status,
#   procedure. Applied by giving the mob NpcVoiceSet with this set; anything not listed is spoken as normal.
#   No warnings: NPCs have nothing non-lethal to back one up with, so NT holds its fire in silence instead.
- type: npcVoiceSet
  id: KsOperativeNt
  silenced:
  - KsOperativeGetAway
  replacements:
    KsOperativeAdvancing: KsOperativeNtAdvancing
    KsOperativeContact: KsOperativeNtContact
    KsOperativeOutOfAmmo: KsOperativeNtOutOfAmmo
    KsOperativeReloading: KsOperativeNtReloading
    KsOperativeHealing: KsOperativeNtHealing
    KsOperativeRetreating: KsOperativeNtRetreating
    KsOperativeHoldingPosition: KsOperativeNtHoldingPosition
    KsOperativeDisturbanceCombat: KsOperativeNtDisturbanceCombat
    KsOperativeDisturbance: KsOperativeNtDisturbance
    KsOperativeAlertGrenade: KsOperativeNtAlertGrenade
    KsOperativeStandDown: KsOperativeNtStandDown
    KsOperativeStandDownAcknowledge: KsOperativeNtStandDownAcknowledge
    KsOperativeSearching: KsOperativeNtSearching
    KsOperativeCalloutReceived: KsOperativeNtCalloutReceived
    KsOperativeLostContact: KsOperativeNtLostContact
    KsOperativeInvestigating: KsOperativeNtInvestigating
    KsOperativeStaging: KsOperativeNtStaging
    KsOperativeBreaching: KsOperativeNtBreaching
    KsOperativeSearchingArea: KsOperativeNtSearchingArea
    KsOperativeRegrouping: KsOperativeNtRegrouping

