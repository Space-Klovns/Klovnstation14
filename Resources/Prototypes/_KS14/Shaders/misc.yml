
# Makes every RGB value white, alpha is untouched
- type: shader
  id: KsWhite
  kind: source
  light_mode: unshaded
  path: "/Textures/_KS14/Shaders/flatcolour.swsl"
  params:
    FLAT: '#FFFFFF'

# Makes every RGB value black, alpha is untouched
- type: shader
  id: KsBlack
  kind: source
  light_mode: unshaded
  path: "/Textures/_KS14/Shaders/flatcolour.swsl"
  params:
    FLAT: '#000000'

# Makes every RGB value a specific color, alpha is untouched
- type: shader
  id: KsFlatColour
  kind: source
  light_mode: unshaded
  path: "/Textures/_KS14/Shaders/flatcolour.swsl"

# Like stencil basically, but much less work
- type: shader
  id: KsCutout
  kind: source
  path: "/Textures/_KS14/Shaders/cutout.swsl"

- type: shader
  id: KsCameraStatic
  kind: source
  path: "/Textures/_KS14/Shaders/camera_static.swsl"
