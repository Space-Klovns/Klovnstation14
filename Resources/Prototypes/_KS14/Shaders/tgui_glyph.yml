- type: shader
  id: KsTguiGlyphBox
  kind: source
  path: "/Textures/_KS14/Shaders/tgui_glyph.swsl"
  params:
    shape: 0.0

- type: shader
  id: KsTguiGlyphTick
  kind: source
  path: "/Textures/_KS14/Shaders/tgui_glyph.swsl"
  params:
    shape: 1.0

- type: shader
  id: KsTguiGlyphChevron
  kind: source
  path: "/Textures/_KS14/Shaders/tgui_glyph.swsl"
  params:
    shape: 2.0

- type: shader
  id: KsTguiGlyphDropdownCell
  kind: source
  path: "/Textures/_KS14/Shaders/tgui_glyph.swsl"
  params:
    shape: 3.0
    # Set, not left to its default: an open dropdown turns its chevron with a unique instance of this shader, and a uniform
    #     this one never sets would keep whatever angle that left behind, so every closed chevron drew askew.
    angle: 0.0
