# Linked gases condense out of tile air into puddles of their reagent past saturation (KsCondensationReaction).
#     maximumTemperature is each gas's van der Waals critical temperature, 8a / (27 R b), above which nothing condenses;
#     KsCondensationTests checks it against the gas's constants.

- type: gasReaction
  id: KsCondensationWaterVapor
  priority: 600
  maximumTemperature: 647.29
  minimumRequirements:
    WaterVapor: 0.05
  effects:
  - !type:KsCondensationReaction
    gas: WaterVapor

- type: gasReaction
  id: KsCondensationOxygen
  priority: 600
  maximumTemperature: 154.16
  minimumRequirements:
    Oxygen: 0.05
  effects:
  - !type:KsCondensationReaction
    gas: Oxygen

- type: gasReaction
  id: KsCondensationNitrogen
  priority: 600
