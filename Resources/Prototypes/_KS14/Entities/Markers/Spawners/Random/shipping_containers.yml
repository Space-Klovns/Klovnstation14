- type: entity
  name: Random Shipping Container Spawner
  suffix: NT+Syndie
  id: ShippingContainerSpawner
  parent: MarkerBase
  components:
  - type: Transform
    noRot: true
  - type: Sprite
    offset: 0,0.5
    noRot: true
    layers:
    - state: red
      scale: 3,2
    - sprite: _KS14/Structures/Storage/shipping_containers.rsi
      state: container_blank
      scale: 0.75, 0.75
  - type: EntityTableSpawner
    offset: 0
    table: !type:NestedSelector
      tableId: ShippingContainerTable

- type: entity
  parent: ShippingContainerSpawner
  id: ShippingContainerSpawnerNt
  name: NanoTrasen Shipping Container Spawner
  suffix: NT
  components:
  - type: Sprite
    layers:
    - state: red
      scale: 3,2
    - sprite: _KS14/Structures/Storage/shipping_containers.rsi
      state: nanotrasen
      scale: 0.75, 0.75
  - type: EntityTableSpawner
    offset: 0
    table: !type:NestedSelector
      tableId: ShippingContainerTableNt

- type: entity
  parent: ShippingContainerSpawner
  id: ShippingContainerSpawnerSyndie
  name: Syndicate Shipping Container Spawner
  suffix: Syndicate
  components:
  - type: Sprite
    layers:
    - state: red
      scale: 3,2
    - sprite: _KS14/Structures/Storage/shipping_containers.rsi
      state: gorlex
      scale: 0.75, 0.75
  - type: EntityTableSpawner
    offset: 0
    table: !type:NestedSelector
      tableId: ShippingContainerTableSyndie
