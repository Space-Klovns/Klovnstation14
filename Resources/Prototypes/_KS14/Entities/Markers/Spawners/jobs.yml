- type: entity
  parent: SpawnPointJobBase
  id: SpawnPointScenarioSyndie
  name: syndicate agent
  components:
  - type: SpawnPoint
    job_id: ScenarioSyndie
  - type: Sprite
    layers:
    - state: green
    - sprite: Mobs/Species/Human/parts.rsi
      state: full
    - sprite: Clothing/Shoes/Boots/combatboots.rsi
      state: equipped-FEET
    - sprite: Clothing/Uniforms/Jumpsuit/operative.rsi
      state: equipped-INNERCLOTHING
    - sprite: Clothing/Back/Backpacks/syndicate.rsi
      state: equipped-BACKPACK
    - sprite: Clothing/Mask/gassyndicate.rsi
      state: equipped-MASK
    - sprite: Clothing/Ears/Headsets/syndicate.rsi
      state: alt-equipped-EARS
    - sprite: Clothing/Belt/militarywebbing.rsi
      state: equipped-BELT
    - sprite: Clothing/Eyes/Hud/synd.rsi
      state: equipped-EYES
    - sprite: Clothing/Hands/Gloves/combat.rsi
      state: equipped-HAND

