# Deliberately not a child of SignalButton: SignalSwitchSystem marks ActivateInWorldEvent handled, and
#   subscription order between it and the elevator system is not defined, so a call button built on one
#   would work or not depending on which system happened to run first. Anyone wanting a press to also drive
#   a chime or an indicator light can wire an ordinary signal button beside this one.
- type: entity
  parent: BaseWallmountMetallic
  id: KsElevatorCallButton
  name: elevator call button
  description: Calls an elevator to this floor.
  components:
  - type: WallMount
    arc: 360
  - type: StationAiWhitelist
  - type: Sprite
    drawdepth: SmallObjects
    sprite: Structures/Wallmounts/switch.rsi
    state: dead
  # No shaftId: an unlabelled button calls whichever unlabelled elevator in its own z-level stack is
  #   nearest, so the same prototype goes on every floor of a shaft with nothing to wire up. Set one in a
  #   map only where a stack holds more than one lift.
  - type: ZLevelElevatorCallButton
  # The call set swallows repeats on its own, so this is here to keep the popup and the click from being
  #   spammed rather than to protect the elevator.
  - type: UseDelay
    delay: 2
  - type: Rotatable
  - type: Transform
    anchored: false
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 80
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 40
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
          params:
            volume: -8
