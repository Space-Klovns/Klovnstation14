
# This is just a collection of walls with their textures ported from Stalker14
# None of these are constructible


- type: entity
  parent: BaseWall
  id: KsWallSolidBunker
  name: bunker wall
  components:
  - type: Sprite
    sprite: _Stalker/Structures/Walls/bunker.rsi
  - type: Icon
    sprite: _Stalker/Structures/Walls/bunker.rsi
  - type: IconSmooth
    key: walls
    base: bunker
  - type: Destructible
    thresholds: &thresholds
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalSlam
    # TODO LCDC STALKERWALLS: more fx for breaking?

- type: entity
  parent: BaseWall
  id: KsWallSolidConcrete
  name: warm concrete wall # warm as in the color
  components:
  - type: Sprite
