### Sprite variants

- type: entity
  parent: SupplyPodCargoBase
  id: SupplyPodCargoBaseSyndicate
  name: syndicate cargo pod
  description: A pod. From somewhere. There's probably something inside! It has the markings of the Syndicate..
  components:
  - type: Sprite
    layers:
    - state: rubble_bg
      visible: false
      map: ["rubble_bg"]
    - state: darkpod
      map: ["pod"]
    - state: darkpod_door
      map: ["door"]
    - map: ["paint_displacement"]
    - state: syndicate
      shader: DisplacedDraw
      map: ["paint"]
    - state: rubble_fg
      visible: false
      map: ["rubble_fg"]
  # GenericVisualizer's visuals dictionary replaces the parent's outright rather than merging
  # into it, so a variant that wants its own reversed states has to restate the whole set.
  - type: GenericVisualizer
    visuals:
      enum.SupplyPodVisuals.Landed:
        rubble_bfg:
          False: { visible: false }
          True: { visible: true }
        rubble_fg:
          False: { visible: false }
          True: { visible: true }
      enum.SupplyPodVisuals.Reversed:
        pod:
          False: { state: darkpod }
          True: { state: darkpod_reverse }
      enum.StorageVisuals.Open:
        door:
          True: { visible: false }
          False: { visible: true }
        paint_displacement:
          True:
            sprite: _KS14/Objects/SupplyPod/displacement.rsi
            state: open
            copyToShaderParameters:
              layerKey: paint
              parameterTexture: displacementMap
              parameterUV: displacementUV
          False:
            sprite: _KS14/Objects/SupplyPod/displacement.rsi
            state: closed
            copyToShaderParameters:
              layerKey: paint
              parameterTexture: displacementMap
              parameterUV: displacementUV

- type: entity
