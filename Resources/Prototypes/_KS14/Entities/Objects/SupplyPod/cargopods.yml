### Sprite variants

- type: entity
  parent: SupplyPodCargoBase
  id: SupplyPodCargoBaseSyndicate
  name: syndicate cargo pod
  description: A pod. From somewhere. There's probably something inside! It has the markings of the Syndicate..
  components:
  - type: Sprite
    layers:
    - state: rubble_bg
      visible: false
      map: ["rubble_bg"]
    - state: darkpod
    - state: darkpod_door
      map: ["door"]
    - map: ["paint_displacement"]
    - state: syndicate
      shader: DisplacedDraw
      map: ["paint"]
    - state: rubble_fg
      visible: false
      map: ["rubble_fg"]

- type: entity
  parent: SupplyPodCargoBase
  id: SupplyPodCargoBaseAdvanced
  name: advanced cargo pod
  description: A pod. From somewhere. There's probably something !COOL! inside!
  components:
  - type: Sprite
    layers:
    - state: rubble_bg
      visible: false
      map: ["rubble_bg"]
    - state: advpod
    - state: advpod_door
      map: ["door"]
    - map: ["paint_displacement"]
    - state: bluespace
      shader: DisplacedDraw
      map: ["paint"]
    - state: rubble_fg
      visible: false
      map: ["rubble_fg"]
  - type: SupplyPodGlow
    glowProto: KsSupplyPodGlowBlue

### Container variants

- type: entity
  parent: SupplyPodCargoBaseSyndicate
  id: SupplyPodCargoSyndicateU43
  name: U-43 combat walker cargo pod
  suffix: Scenario
  description: A Syndicate drop pod containing a U-43 combat walker.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: MechU43Battery
        - id: WelderMini
