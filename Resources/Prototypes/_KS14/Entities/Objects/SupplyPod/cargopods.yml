  # GenericVisualizer's visuals dictionary replaces the parent's outright rather than merging
  # into it, so a variant that wants its own reversed states has to restate the whole set.
  - type: GenericVisualizer
    visuals:
      enum.SupplyPodVisuals.Landed:
