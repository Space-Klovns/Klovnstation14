          True: { visible: true }
        rubble_fg:
          False: { visible: false }
          True: { visible: true }
      enum.SupplyPodVisuals.Reversed:
        pod:
          False: { state: advpod }
          True: { state: advpod_reverse }
      enum.StorageVisuals.Open:
        door:
          True: { visible: false }
          False: { visible: true }
        paint_displacement:
          True:
