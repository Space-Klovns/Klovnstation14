- type: entity
  id: WeaponMechCombatLaser
  name: Lance
  description: Semi-automatic heavy pulsed laser. Preferred by Cybersun.
  suffix: Mech Weapon, Gun, Combat, Laser
  parent: BaseMechWeaponRange
  components:
  - type: Sprite
    sprite: _Crescent/Objects/Specific/Mech/mechaweapons.rsi
    state: plasmalaser
  - type: Gun
    fireRate: 1
    selectedMode: SemiAuto
    availableModes:
      - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/laser_cannon.ogg
  - type: BatteryAmmoProvider
    proto: MechLaser
    fireCost: 40
  - type: Appearance
  - type: AmmoCounter

