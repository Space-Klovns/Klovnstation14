- type: entity
  parent: BaseItem
  id: KsClothingOuterIvDrip
  name: IV drip
  description: A wearable intravenous drip with a configurable pump.
  components:
  - type: Tag
    tags:
    - ClothMade
    - Recyclable
    - WhitelistChameleon
  - type: Item
    size: Small
  - type: Clothing
    sprite: _KS14/Objects/Specific/Chemistry/iv_drip_civ.rsi
    quickEquip: true
    slots:
    - neck
  - type: Sprite
    sprite: _KS14/Objects/Specific/Chemistry/iv_drip_civ.rsi
    layers:
      - state: base
      - state: base1
        map: ["enum.SolutionContainerLayers.Fill"]
        visible: false
  - type: Appearance
  - type: IvDrip
    solutionName: ivDrip
    injectionEnabled: false
    injectionAmount: 1
    injectionInterval: 1
    canSetInjectionAmount: true
    canSetInjectionInterval: true
    spillOnWearerAttacked: true
    spillAmount: 5
  - type: SolutionContainerVisuals
    maxFillLevels: 6
    fillBaseName: base
    inHandsMaxFillLevels: 4
    inHandsFillBaseName: -fill-
    solutionName: ivDrip
  - type: SolutionManager
    solutions: null
    solutionData:
      ivDrip:
        maxVol: 200
  - type: DrawableSolution
    solution: ivDrip
  - type: SolutionTransfer
    canChangeTransferAmount: true
  - type: RefillableSolution
    solution: ivDrip
  - type: DrainableSolution
    solution: ivDrip
  - type: ExaminableSolution
    solution: ivDrip
  - type: Spillable
    solution: ivDrip
  - type: UserInterface
    interfaces:
      enum.IvDripUiKey.Key:
        type: IvDripBoundUserInterface
  - type: ActivatableUI
    key: enum.IvDripUiKey.Key
