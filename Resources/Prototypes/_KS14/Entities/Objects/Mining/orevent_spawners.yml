# Ore vents that are being tapped will spawn entities to
#   handle entities being spawned for wave defence. These are those entities.

- type: entity
  id: KsOreVentMobSpawnerBase
  name: ore-vent mob spawner
  description: You shouldn't see this!
  abstract: true
  categories: [ HideSpawnMenu ]
  components:
  - type: TimedSpawner
    chance: 1
    intervalSeconds: 10
    spawnImmediately: true
    minimumEntitiesSpawned: 1
    maximumEntitiesSpawned: 2
    minRadius: 4.5
    maxRadius: 6
    sound: # tgstation's spawner plays this once per wave, at volume 40 (of 100), about -8 dB
      path: /Audio/_KS14/Effects/node_drilling.ogg
      params:
        volume: -8

- type: entity
  parent: KsOreVentMobSpawnerBase
  id: KsOreVentMobSpawnerLava
  categories: [ HideSpawnMenu ]
  components:
  - type: TimedSpawner
    prototypes:
    - KsOreVentTelegraphWatcherLavaland
    - KsOreVentTelegraphGoliath

- type: entity
  parent: KsOreVentMobSpawnerBase
  id: KsOreVentMobSpawnerIce
  categories: [ HideSpawnMenu ]
  components:
  - type: TimedSpawner
    prototypes:
    - KsOreVentTelegraphWatcherIcewing
    - KsOreVentTelegraphGoliath
    - KsOreVentTelegraphBasilisk

# Telegraphs: what a vent's spawner actually spawns. Each marks the ground for a moment before its mob comes out of
#   it, so that nobody gets a goliath on top of them without warning.

- type: entity
  id: KsOreVentTelegraphGoliath
  name: marked ground
  description: Something is coming up here.
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
    anchored: true
  # tgstation's /obj/effect/temp_visual/dust_cloud: it plays once over 1s, above mobs, and sits 4px down and left.
  - type: Sprite
    sprite: _KS14/Effects/dust_cloud.rsi
    offset: -0.125,-0.125
    drawdepth: OverMobs
    layers:
    - state: light_dust_cloud
      loop: false
  - type: TimedDespawn
    lifetime: 1.2
  - type: SpawnOnDespawn
    prototype: MobGoliath
  - type: KsPopupOnDespawn # as tgstation's spawner component says when a vent's mob comes out
    message: ks-specific-orevent-creature-emerges

- type: entity
  parent: KsOreVentTelegraphGoliath
  id: KsOreVentTelegraphWatcherLavaland
  categories: [ HideSpawnMenu ]
  components:
  - type: SpawnOnDespawn
    prototype: MobWatcherLavaland

- type: entity
  parent: KsOreVentTelegraphGoliath
  id: KsOreVentTelegraphWatcherIcewing
  categories: [ HideSpawnMenu ]
  components:
  - type: SpawnOnDespawn
    prototype: MobWatcherIcewing

- type: entity
  parent: KsOreVentTelegraphGoliath
  id: KsOreVentTelegraphBasilisk
  categories: [ HideSpawnMenu ]
  components:
  - type: SpawnOnDespawn
    prototype: MobBasilisk
