- type: entity
  id: KsOreVent
  name: ore vent
  description: "An ore vent, brimming with underground ore. Once discovered, it can be scanned again for ore extraction to be started."
  placement:
    mode: SnapgridCenter
  components:
  # Physics
  - type: Transform
    anchored: true
    noRot: true
  - type: Physics
    bodyType: Static
    canCollide: true
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 1200
        layer:
        - HalfWallLayer

  # Vent
  - type: DoAfter # doafter is on the vent
  - type: OreVent
    preExtractionDuration: 3s
    clearingIterations: 6
    tappingProcessEntityProto: KsOreVentMobSpawnerLava
    droneEntityProto: KsOreVentDrone
    extractionDuration: 45s
  - type: Explosive
    explosionType: OreVentClearing
    maxIntensity: 100
    totalIntensity: 80
    intensitySlope: 5
    canCreateVacuum: false
    repeatable: true
    deleteAfterExplosion: false

  # Sprites
  - type: Sprite
    sprite: _KS14/Objects/Mining/ore_vent.rsi
    offset: 0,0.5
    layers:
    - state: ore_vent
      map: ["enum.MiningScannerVisualLayers.Overlay", "vent"]
    - state: well
      visible: false
      map: ["well"]
  - type: GenericVisualizer
    visuals:
      enum.OreVentVisuals.Tapped:
        vent:
          True: { state: ore_vent_active }
          False: { state: ore_vent }
        well:
          True: { visible: true }
          False: { visible: false }
  - type: SpriteFade
  - type: InteractionOutline
  - type: Clickable
  - type: Appearance

  # Scanning
  - type: MiningScannerViewable

  - type: KsScanDiscoverable
    discoveryPopupLoc: ks-specific-orevent-discovered
    trueName: discovered ore vent
  - type: KsScanTriggerOnDiscovered
    keyOut: discovered
  - type: AddComponentsOnTrigger
    keysIn: [discovered]
    components: # copied from PenEmbeddable
    - type: KsRadarInterest
      data:
        text: ore vent

- type: entity
  parent: KsOreVent
  id: KsOreVentIce
  suffix: Ice
  components:
  - type: OreVent
    tappingProcessEntityProto: KsOreVentMobSpawnerIce

  - type: Sprite
    layers:
    - state: ore_vent_ice
      map: ["enum.MiningScannerVisualLayers.Overlay", "vent"]
    - state: well
      visible: false
      map: ["well"]
  - type: GenericVisualizer
    visuals:
      enum.OreVentVisuals.Tapped:
        vent:
          True: { state: ore_vent_ice_active }
          False: { state: ore_vent_ice }
        well:
          True: { visible: true }
          False: { visible: false }

- type: entity
  parent: KsOreVent
  id: KsOreVentDebug
  suffix: Debug
  categories: [ Debug ]
  components:
  - type: OreVent
    preExtractionDuration: 1s
    clearingIterations: 2
    clearRadius: 1
    tappingProcessEntityProto: KsOreVentMobSpawnerLava
    droneEntityProto: KsOreVentDrone
    extractionDuration: 5s
  - type: Sprite
    color: '#fb00ff80'
