- type: entity
  id: KsGeyserBase
  name: undiscovered geyser
  description: It's a geyser.
  abstract: true
  placement:
    mode: SnapgridCenter
  components:
  # Sprites
  - type: Sprite
    sprite: _KS14/Objects/Misc/geyser.rsi
    noRot: true
    offset: 0,0.5
    layers:
    - state: geyser
    - state: soup1
      map: ["enum.SolutionContainerLayers.Fill"]
      shader: unshaded
    - state: soup1
      color: '#000000ab'
  - type: InteractionOutline
  - type: Clickable
  - type: Appearance
  - type: SolutionContainerVisuals
    maxFillLevels: 1
    fillBaseName: soup
    solutionName: buffer

  # Plumbing
  - type: PlumbingDevice
    updateInterval: 2
  - type: PlumbingOutlet
    solutionName: buffer
  - type: NodeContainer
    nodes:
      outlet:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: Fourway

  # Solution
  - type: SolutionRegeneration
    solution: buffer
    generated:
      reagents:
      - ReagentId: Water
        Quantity: 100
  - type: SolutionContainerManager
    solutions:
      buffer:
        maxVol: 100
        canReact: false
  - type: DrainableSolution
    solution: buffer

  # Physics
  - type: Transform
    anchored: true
    noRot: false
  - type: Physics
    bodyType: Static

  # Geyser
  - type: KsScanDiscoverable
    discoveryPopupLoc: ks-specific-geyser-discovered
    trueName: discovered geyser

- type: entity
  parent: KsGeyserBase
  id: KsGeyserBaseRare
  abstract: true
  components:
  - type: KsScanDiscoverable
    discoveryPopupLoc: ks-specific-geyser-discovered-rare

- type: entity
  parent: KsGeyserBaseRare
  id: KsGeyserPlasma
  suffix: Plasma
  components:
  - type: SolutionRegeneration
    solution: buffer
    generated:
      reagents:
      - ReagentId: Plasma
        Quantity: 100
  - type: SolutionContainerManager
    solutions:
      buffer:
        maxVol: 100
        canReact: false
  - type: KsScanDiscoverable
    discoveryPopupLoc: ks-specific-geyser-discovered-rare
    trueName: plasma geyser

- type: entity
  parent: KsGeyserBaseRare
  id: KsGeyserFresium
  suffix: Fresium
  components:
  - type: SolutionRegeneration
    solution: buffer
