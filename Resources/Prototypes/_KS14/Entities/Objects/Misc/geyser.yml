      reagents:
      - ReagentId: Fresium
        Quantity: 100
  - type: SolutionContainerManager
    solutions:
      buffer:
        maxVol: 100
        canReact: false
  - type: KsScanDiscoverable
    discoveryPopupLoc: ks-specific-geyser-discovered-rare
    trueName: fresium geyser
