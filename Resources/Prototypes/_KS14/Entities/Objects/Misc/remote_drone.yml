
## Device ports

- type: sourcePort
  id: RemoteDroneSender
  name: signal-port-name-remote-drone-sender
  description: signal-port-description-remote-drone-sender
  defaultLinks: [ RemoteDroneReceiver ]

- type: sinkPort
  id: RemoteDroneReceiver
  name: signal-port-name-remote-drone-receiver
  description: signal-port-description-remote-drone-receiver
  defaultLinks: [ RemoteDroneSender ]

## Entities

- type: entity
  parent: BaseItem
  id: RemoteDroneLaptop
  name: drone control laptop
  components: # Drone control laptop intentionally doesnt have DeviceNetwork so that it can be hardcoded or whatever
  - type: Sprite
    sprite: _KS14/Objects/Misc/modular_laptop.rsi
    layers:
    - state: laptop
      scale: 0.8, 0.8
    - state: hostile
      scale: 0.8, 0.8
      shader: unshaded
  - type: RemoteDroneController
    sourcePort: RemoteDroneSender
  - type: WirelessNetworkConnection
    range: 150
  - type: DeviceLinkSource
    range: 150
    ports:
    - RemoteDroneSender

  # UI
  - type: ActivatableUI
    key: enum.SurveillanceCameraMonitorUiKey.Key
  - type: SurveillanceCameraMonitor
  - type: ActivatableUIRequiresVision
  - type: UserInterface
    interfaces:
      enum.SurveillanceCameraMonitorUiKey.Key:
        type: SurveillanceCameraMonitorBoundUserInterface

- type: entity
  parent: [ BaseMob, BaseStructureDynamic ]
  id: RemoteDroneFpv
  name: fpv drone
  description: A relic of a historic war.
  components:
  # Misc
  - type: Sprite
    noRot: true
    sprite: Structures/monitors.rsi
    layers:
    - map: [ "enum.SurveillanceCameraVisualsKey.Key" ]
      state: mobilevision
  - type: FlyBySound
    prob: 0
    sound:
      path: /Audio/_KS14/Effects/fpv_drone_flyby.ogg

  # Mob
  - type: Eye
  - type: CanMoveInAir
  - type: MovementSpeedModifier
    baseWalkSpeed: 4.0
    baseSprintSpeed: 8
    baseAcceleration: 5
    baseFriction: 5
    frictionNoInput: 3.5

  # Other mob-related
  - type: RequireProjectileTarget
    active: True # EVIL
  #- type: InteractionOutline

  # Device network
  - type: WirelessNetworkConnection
    range: 150
  - type: DeviceLinkSink
    ports:
    - RemoteDroneReceiver
  - type: DeviceNetwork
    deviceNetId: Private

  # Drone
  - type: RemoteDrone
    sinkPort: RemoteDroneReceiver
  - type: FpvDrone
    flybySoundProbability: 0.65
    audioSpecifier:
      path: /Audio/_KS14/Effects/fpv_drone_static.ogg
      params:
        loop: true
        volume: -1
  - type: SurveillanceCamera
    mobile: True  # Goobstation - mobile cameras fix
  - type: Item
    size: Ginormous

  # Damage
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 60
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]

  # Fixtures
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.3
        density: 45
        mask:
        - SmallMobMask
        layer:
        - SmallMobLayer
      fly-by:
        shape: !type:PhysShapeCircle
          radius: 3.25
        hard: False
        layer:
        - MobMask
