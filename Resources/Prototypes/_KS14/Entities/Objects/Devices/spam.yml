- type: entity
  parent: BaseItem
  id: KsSPAM
  name: S.P.A.M.
  description: The Salvager Personal Miner Assistant. Log in with your ID for tasks, your rank and your mining points. Use it on a dead creature to scan it for a task.
  components:
  - type: Sprite
    sprite: Objects/Devices/tablets.rsi
    layers:
    - state: tablet
    - state: generic
      shader: unshaded
  - type: Item
    size: Small
  - type: KsSPAM
    shownMaterials:
    - Steel
    - Glass
    - Plasma
    - Silver
    - Gold
    - Uranium
    - Diamond
  - type: ActivatableUI
    inHandsOnly: true
    key: enum.KsSPAMUiKey.Key
  - type: UserInterface
    interfaces:
      enum.KsSPAMUiKey.Key:
        type: KsSPAMBoundUserInterface
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_KS14/Handling/component_pickup.ogg
  - type: EmitSoundOnDrop
    sound:
      path: /Audio/_KS14/Handling/component_drop.ogg
