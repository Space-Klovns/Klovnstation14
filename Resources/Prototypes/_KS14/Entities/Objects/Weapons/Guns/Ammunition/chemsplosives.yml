- type: entity
  parent: BaseGrenade
  id: KsBaseGrenadeChemical
  name: chemical grenade round
  description: A grenade round that releases chemicals on impact.
  abstract: true
  components:
  - type: CartridgeAmmo
    proto: KsBulletGrenadeChemical
  - type: ChemicalPayloadAmmo
    spill: false
  - type: ChemicalPayload
    spill: true
    beakerSlotA: &slotDef
      whitelist:
        components:
        - FitsInDispenser
      swap: false
    beakerSlotB: *slotDef
  - type: ItemSlots
  - type: ContainerContainer
    containers:
      BeakerSlotA: !type:ContainerSlot
      BeakerSlotB: !type:ContainerSlot

  - type: Sprite
    sprite: _KS14/Objects/Weapons/Guns/Ammunition/Explosives/chem_nade.rsi
    layers:
    - state: full
      map: ["base"]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.AmmoVisuals.Spent:
        base:
          False: { sprite: _KS14/Objects/Weapons/Guns/Ammunition/Explosives/chem_nade.rsi, state: full }
          True: { sprite: Objects/Weapons/Guns/Ammunition/Explosives/explosives.rsi, state: spent }
        stripe:
          False: { visible: true }
          True: { visible: false }

# Constructible grenade round
- type: entity
  parent: KsBaseGrenadeChemical
  id: KsGrenadeChemical
  description: A grenade round with a chemical payload fitted on the tip.
  components:
  - type: Construction
    graph: KsGrenadeChemical
    node: finished
  - type: Sprite
    layers:
    - state: empty
      map: ["enum.AmmoVisualLayers.Base", "base"]
  - type: GenericVisualizer
    visuals:
      enum.ChemicalPayloadVisuals.Slots:
        base:
          None: { state: empty }
          Left: { state: left }
          Right: { state: right }
          Both: { state: armed }
      enum.AmmoVisuals.Spent:
        base:
          False: { visible: true }
          True: { visible: false }
        spent:
          False: { visible: false }
          True: { visible: true, sprite: Objects/Weapons/Guns/Ammunition/Explosives/explosives.rsi, state: spent }


### Incendiary

- type: entity
  parent: Beaker
  id: KsGrenadeChemicalPresetIncendiaryBeakerA
  categories: [ HideSpawnMenu ]
  components:
  - type: Solution
    solution:
      reagents:
      - ReagentId: Phosphorus
        Quantity: 40
      - ReagentId: Plasma
        Quantity: 42
      maxVol: 82
      temperature: 800

- type: entity
  parent: Beaker
  id: KsGrenadeChemicalPresetIncendiaryBeakerB
  categories: [ HideSpawnMenu ]
  components:
  - type: Solution
    solution:
      reagents:
      - ReagentId: Klovnide
        Quantity: 2
      - ReagentId: SulfuricAcid
        Quantity: 40
      - ReagentId: ChlorineTrifluoride
        Quantity: 18
      maxVol: 80
      temperature: 300

- type: entity
  parent: KsBaseGrenadeChemical
  id: KsGrenadeChemicalPresetIncendiary
  description: A grenade round that releases chemicals on impact. An orange stripe on the tip denotes an incendiary payload.
  suffix: Preset, Incendiary
  components:
  - type: Sprite
    layers:
    - state: full
      map: ["base"]
    - state: stripe
      color: '#d6651fcc'
      map: ["stripe"]
  - type: ChemicalPayload
    beakerSlotA:
      locked: true
      startingItem: KsGrenadeChemicalPresetIncendiaryBeakerA
    beakerSlotB:
      locked: true
      startingItem: KsGrenadeChemicalPresetIncendiaryBeakerB

