- type: entity
  parent: [WeaponDisabler]
  id: WeaponDisablerBorg
  name: cyborg disabler
  description: A self charging integrated disabler for security cyborgs.
  components:
  - type: BatterySelfRecharger
    autoRechargeRate: 30

- type: entity
  name: laser gun
  parent: [WeaponDisablerPractice, BaseSecurityCommandContraband]
  id: KSLaserGun
  description: A self-defense weapon that exhausts organic targets, weakening them until they collapse.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Battery/disabler.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-unshaded-0
        map: ["enum.GunVisualLayers.MagUnshaded"]
        shader: unshaded
  - type: Clothing
    sprite: Objects/Weapons/Guns/Battery/disabler.rsi
    quickEquip: false
    slots:
      - suitStorage
      - Belt
  - type: BatteryAmmoProvider
    proto: BulletDisabler
    fireCost: 100

- type: entity
  name: energy gun
  parent: [BaseWeaponBatterySmall, BaseSecurityCommandContraband]
  id: KSEnergyGun
  description: A self-defense weapon that exhausts organic targets, weakening them until they collapse.
  components:
  - type: Sprite
    sprite: _KS14/Objects/Weapons/Guns/Battery/energygun.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-unshaded-0
        map: ["enum.GunVisualLayers.MagUnshaded"]
        shader: unshaded
  - type: MagazineVisuals
    magState: mag
    steps: 4
    zeroVisible: true
  - type: Clothing
    sprite: _KS14/Objects/Weapons/Guns/Battery/energygun.rsi
    quickEquip: false
    slots:
      - suitStorage
      - Belt
  - type: BatteryWeaponFireModes
    fireModes:
    - proto: BulletLaserWindowPiercing
      fireCost: 150
    - proto: BulletDisabler
      fireCost: 62.5
      pacifismAllowedMode: true

