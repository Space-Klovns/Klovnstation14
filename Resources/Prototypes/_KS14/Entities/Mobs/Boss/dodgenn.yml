- type: entity
  parent: [ BaseSimpleMob, MobCombat, StripableInventoryBase ]
  id: KsMobDodgenn
  name: Albert Wesker
  description: 7 minutes. 7 minutes is all I have to play with you.
  components:
  - type: Sprite
    sprite: _KS14/Mobs/Boss/dodgenn.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: icon
  - type: MeleeWeapon
    hidden: true
    altDisarm: true
    animation: WeaponArcKick
    soundHit:
      collection: GenericHit
    damage:
      types:
        Blunt: 15
  - type: MovementSpeedModifier
    baseWalkSpeed : 3
    baseSprintSpeed : 6

  - type: Climbing
  - type: SlowOnDamage
    speedModifierThresholds:
      60: 0.7
      80: 0.5

  - type: GunDodger

  - type: Butcherable
    butcheringType: Knife
    spawned:
    - id: KsClothingEyesGlassesDodgenn
      amount: 1

  - type: DamageStateVisuals
    states:
      Alive:
        Base: icon
      Critical:
        Base: oof
      Dead:
        Base: oof

  - type: JumpAbility
    action: KsActionDodgennDash
    canCollide: true
    jumpDistance: 5
    punishKnockdown: null
    hitStaminaDamage: 40
    collideKnockdown: 0
    hitKnockdownDuration: 33
    jumpSound:
      path: /Audio/Weapons/punchmiss.ogg
      params:
        pitch: 0.9
        volume: -2
        variation: 0.05

  - type: ComplexInteraction
  - type: ContainerContainer
  - type: ComplexShove # KS14: shove rework
  - type: NpcFactionMember
    factions:
    - AllHostile

  - type: Inventory
    templateId: human
  - type: Hands
    hands:
      right:
        location: Right
      left:
        location: Left
    sortedHands:
    - right
    - left

  - type: Speech
    speechSounds: Alto
  - type: DamageForceSay
  - type: Vocal
    sounds:
      Male: MaleHuman
      Female: FemaleHuman
      Unsexed: MaleHuman
  - type: Emoting
  - type: BodyEmotes
    soundsId: GeneralBodyEmotes
  - type: AnimatedEmotes
  - type: Grammar
    attributes:
      proper: true

- type: entity
  parent: BaseAction
  id: KsActionDodgennDash
  name: Dash
  description: Dash in the direction you are moving.
  components:
  - type: Action
    useDelay: 5
    icon:
      sprite: Interface/Actions/jump.rsi
      state: icon
  - type: InstantAction
    event: !type:GravityJumpEvent
      staminaCost: 10

- type: entity
  parent: ClothingEyesGlassesSunglasses
  id: KsClothingEyesGlassesDodgenn
  name: dodgenn mask
  description: Gives you the ability to dodge bullets. Takes your ability to shoot bullets.
  suffix: Boss Loot
  components:
  - type: Sprite
    sprite: _KS14/Mobs/Boss/dodgenn.rsi
    layers:
    - state: icon
      scale: 0.75,0.75
      color: '#ffffff'
      shader: Noir
  - type: ClothingGrantComponent
    component:
    - type: GunDodger
    - type: Clumsy # TODO KS14 DODGENN: make this into something eventbased on the clothing entity instead of this bs
      clumsyDefaultCheck: 1
      clumsyHypo: true
      clumsyGuns: true
      clumsyDefib: false
      clumsyCatching: false
      clumsyVaulting: false
  - type: MovementIgnoreGravity
    weightless: true
  - type: FloatingVisuals
    canFloat: true
    animationTime: 0.1
    offset: 0,0.5
  - type: Clothing
    sprite: _KS14/Mobs/Boss/dodgenn.rsi
    clothingVisuals:
      eyes:
      - state: icon
        color: '#ffffff'
        shader: Noir

### Boss

- type: entity
  parent: KsMobDodgenn
  id: KsMobDodgennBoss
  name: The Mastermind
  suffix: Bossfight
  components:
  - type: NpcFactionMember
    factions:
    - SimpleHostile
  - type: NpcRangedAttackPatternHolder
    attacks:
      spiral: DodgennSpiralAttack
      enragedSpiral: DodgennEnragedSpiralAttack
      shotgun: DodgennShotgunAttack
      directional: DodgennDirectionalAttack
      randomAoe: DodgennRandomAoeAttack
  - type: ActionGrant
    actions:
    - KsActionDodgennDial
    - KsActionDodgennFear
    - KsActionDodgennBossGrenade
  - type: SlowOnDamage
    speedModifierThresholds:
      1250: 0.7
      2000: 0.5
  - type: MobThresholds
    thresholds:
      0: Alive
      2500: Dead
  - type: Stamina
    baseCritThreshold: 200
  - type: NPCSteering
  - type: NpcAggro
  - type: GunDodger
    dodgeChance: 0.4
  - type: HTN
    constantlyReplan: true
    rootTask:
      task: DodgennCompound
    blackboard:
      VisionRadius: !type:Single
        14
      AggroVisionRadius: !type:Single
        20
      NavSmash: !type:Bool
        true
      RangedRange: !type:Single
        6
      MeleeRange: !type:Single
        1
      LeapMinDistance: !type:Single
        6
  - type: JumpAbility
    action: KsActionDodgennBossDash

- type: entity
  parent: BaseAction
  id: KsDodgennActionBase
  abstract: true
  components:
  - type: Action
    raiseOnAction: true
    useDelay: 1
    whitelist:
      components:
      - MobState
  - type: TargetAction
    range: -1
    checkCanAccess: false
  - type: TriggerOnActionPerformed
    userIsTarget: true

- type: entity
  parent: KsDodgennActionBase
  id: KsActionDodgennDial
  name: Deploy Supplypod
  components:
  - type: Action
    useDelay: 5
    priority: -9
  - type: WorldTargetAction
    event: !type:WorldSpawnSpellEvent
      prototypes:
      - id: SupplyPodCargoSyndicateAT4
        amount: 1

- type: entity
  parent: KsDodgennActionBase
  id: KsActionDodgennFear
  components:
  - type: EntityTargetAction
    event: !type:KsTriggerOnActionPerformedEntityTargetActionEvent
    canTargetSelf: false
  - type: SetStatusEffectOnTrigger
    targetUser: true
    status: KsStatusEffectDodgennFight
    duration: 25s

- type: entity
  parent: MobStatusEffectDebuff
  id: KsStatusEffectDodgennFight
  name: dodgenn fight
  components:
  - type: KsAudioStatusEffect
    sound:
      path: /Audio/Lobby/ddosking.ogg
      params:
        loop: true
        pitch: 1.25
    fadeWithTimeLeft: true

- type: entity
  parent: KsDodgennActionBase
  id: KsActionDodgennBossDash
  name: dash
  components:
  - type: Action
    useDelay: 5
    icon:
      sprite: Interface/Actions/jump.rsi
      state: icon
  - type: WorldTargetAction
    event: !type:KsGravityJumpWorldEvent
      staminaCost: 0

- type: entity
  parent: KsDodgennActionBase
  id: KsActionDodgennBossGrenade
  name: grenade
  components:
  - type: WorldTargetAction
    event: !type:SpawnThrownActionEvent
      prototype: KsDodgennExplosive

- type: entity
  parent: BaseItem
  id: KsDodgennExplosive
  name: dodgenn explosive
  description: It's gonna blow up!
  components:
  - type: Sprite
    sprite: Objects/Fun/snap_pops.rsi
    state: icon
  - type: Item
    size: Tiny
  - type: Explosive
    totalIntensity: 50
    maxIntensity: 50
    intensitySlope: 25
    explosionType: Default
    canCreateVacuum: false
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 5
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/snap.ogg
      - !type:ExplodeBehavior
  - type: DamageOnLand
    damage:
      types:
        Blunt: 15
  - type: Damageable
  - type: Injurable
    damageContainer: Inorganic
