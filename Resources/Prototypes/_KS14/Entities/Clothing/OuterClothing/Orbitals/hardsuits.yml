- type: entity
  parent: [ ClothingOuterHardsuitBase, BaseCargoContraband ]
  id: ClothingOuterOrbitalBeltminerSuit
  name: orbital beltminer hardsuit
  description: A lightweight hardsuit with modest protection and a built-in helmet light.
  components:
  - type: Sprite
    sprite: _KS14/Clothing/OuterClothing/Orbitals/narednik.rsi
  - type: Clothing
    sprite: _KS14/Clothing/OuterClothing/Orbitals/narednik.rsi
  - type: ClothingSpeedModifier
    walkModifier: 1
    sprintModifier: 1
  - type: PressureProtection
    highPressureMultiplier: 0.8
    lowPressureMultiplier: 1000
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.9
        Slash: 0.9
        Piercing: 0.9
  - type: ToggleableClothing
    clothingPrototype: ClothingHeadHelmetOrbitalBeltminer
  - type: HideLayerClothing
    slots:
    - RFoot
    - LFoot

- type: entity
  parent: [ ClothingOuterHardsuitSalvage, BaseCargoContraband ]
  id: ClothingOuterHardsuitOrbitalNarednik
  name: orbital narednik hardsuit
  description: A reinforced mining hardsuit assigned to orbital leadership.
  components:
  - type: Sprite
    sprite: _KS14/Clothing/OuterClothing/Orbitals/beltminer.rsi
  - type: Clothing
    sprite: _KS14/Clothing/OuterClothing/Orbitals/beltminer.rsi
  - type: ToggleableClothing
    clothingPrototype: ClothingHeadHelmetOrbitalNarednik
  - type: HideLayerClothing
    slots:
    - RFoot
    - LFoot
