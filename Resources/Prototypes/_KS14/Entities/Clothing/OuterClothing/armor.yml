- type: entity
  parent: [ClothingOuterBaseMedium, AllowSuitStorageClothing, BaseSecurityContraband]
  id: ClothingOuterArmorHazardous
  name: hazardous environment armor
  description: A modified armor vest that offers additional survivability when facing arc flashes, explosions and radiation. Lesser protection.
  components:
  - type: Sprite
    sprite: _KS14/Clothing/OuterClothing/Armor/hev.rsi
  - type: Clothing
    sprite: _KS14/Clothing/OuterClothing/Armor/hev.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.85
        Slash: 0.85
        Piercing: 0.85
        Radiation: 0.50
        Heat: 0.80
        Cold: 0.80
        Shock: 0.80
      flatReductions: #KS14 modified
        Piercing: 3.1
  - type: ExplosionResistance
    damageCoefficient: 0.75
  - type: ClothingGrantComponent # KS14 - arc flash
    component:
    - type: ArcFlashInsulated

- type: entity
  parent: [ClothingOuterWinterCoatToggleable, ClothingOuterBaseMedium, AllowSuitStorageClothing, BaseCargoContraband]
  id: ClothingOuterExplorerSuit
  name: explorer suit
  description: A heavy-duty suit designed for mining operations, offering protection against physical hazards and environmental dangers.
  components:
  - type: ToggleableClothing
    clothingPrototype: ClothingHeadHatHoodExplorerSuit
    slot: head
  - type: Sprite
    sprite: _KS14/Clothing/OuterClothing/Armor/explorer.rsi
  - type: Clothing
    sprite: _KS14/Clothing/OuterClothing/Armor/explorer.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.75
        Slash: 0.65
        Piercing: 0.75
        Radiation: 0.35
        Heat: 0.75

# Black plate armour, with sprites from Stalker14. Between a bulletproof vest and the raid suit: all-round protection, no
#   resistance to vacuum, and the suit storage slot an air tank goes in.
- type: entity
  parent: [ BaseCentcommContraband, ClothingOuterBaseLarge, AllowSuitStorageClothing ]
  id: KsClothingOuterArmorBlackPlate
  name: black plate armor
  description: Heavy black plates over a padded suit, and nothing on any of it to say whose it is.
  components:
  - type: Sprite
    sprite: _Stalker/Objects/Clothing/outerClothing/legat_deserter.rsi
  - type: Clothing
    sprite: _Stalker/Objects/Clothing/outerClothing/legat_deserter.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.6
        Slash: 0.6
        Piercing: 0.5
        Heat: 0.75
      flatReductions:
        Piercing: 10
  - type: ExplosionResistance
    damageCoefficient: 0.7
