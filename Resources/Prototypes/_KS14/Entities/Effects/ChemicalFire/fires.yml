# A plain, hot chemfire. Burns whatever the tile has to offer and does not feed on anything itself.
- type: entity
  parent: BaseChemicalFire
  id: ChemicalFire
  components:
  - type: ChemicalFire
    color: "#FF9030"
    duration: 6.5
    temperature: 1500
    exposedVolume: 50
    heatPower: 12000
  - type: ChemicalFireGasConsumer
    gases:
      Oxygen: 1.5
    producedGasRatios:
      CarbonDioxide: 1.4
      WaterVapor: 0.1

# Plasma-fed: eats the tile's plasma and goes out the moment there is none left.
- type: entity
  parent: ChemicalFire
  id: ChemicalFirePlasma
  name: plasma fire
  components:
  - type: ChemicalFire
    color: "#B040FF"
    duration: 20
    temperature: 2500
    exposedVolume: 75
    emissionRange: 0.4
  - type: ChemicalFireGasConsumer
    gases:
      Plasma: 0.5

# Short, cold-ish flare. Shares no connection key with the others, so it stacks on their tiles.
- type: entity
  parent: ChemicalFire
  id: ChemicalFireFrost
  name: frost fire
  components:
  - type: ChemicalFire
    color: "#50D0FF"
    duration: 6
    temperature: 700
    exposedVolume: 25

- type: entity
  parent: ChemicalFire
  id: ChemicalFireThermite
  name: thermite fire
  components:
  - type: ChemicalFire
    color: "#ffc291"
    duration: 7
    temperature: 2900
    heatPower: 18000
    extinguishable: false # thermite burns through a dousing
    # Foam has to win a fight with it: a blanket smothers it at its foam over 26 a second, while the fire puts all its
    #     heat into boiling the blanket (about 0.27u a second, at the ~67600 J a unit of foam takes). A full blanket
    #     left alone adds up to only maxFoam^2 / (2 * 0.27 * 26), about 0.9 of the progress needed, so it loses; one
    #     kept topped up by spraying wins in 26 / maxFoam, about 7.5 seconds. KsFoamContestTest checks both.
    foamSmotherResistance: 26
    foamHeatFraction: 1
  - type: SparkOnTrigger
  - type: TriggerOnSpawn
