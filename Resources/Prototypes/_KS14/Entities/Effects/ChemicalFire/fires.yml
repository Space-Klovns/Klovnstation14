# A plain, hot chemfire. Burns whatever the tile has to offer and does not feed on anything itself.
- type: entity
  parent: BaseChemicalFire
  id: ChemicalFire
  components:
  - type: ChemicalFire
    color: "#FF9030"
    duration: 6.5
    temperature: 1500
    exposedVolume: 50
    heatPower: 7000
  - type: ChemicalFireGasConsumer
    gases:
      Oxygen: 3
    producedGasRatios:
      CarbonDioxide: 2.92
      WaterVapor: 0.08

# Plasma-fed: eats the tile's plasma and goes out the moment there is none left.
- type: entity
  parent: ChemicalFire
  id: ChemicalFirePlasma
  name: plasma fire
  components:
  - type: ChemicalFire
    color: "#B040FF"
    duration: 20
    temperature: 2500
    exposedVolume: 75
    emissionRange: 0.4
  - type: ChemicalFireGasConsumer
    gases:
      Plasma: 0.5

# Short, cold-ish flare. Shares no connection key with the others, so it stacks on their tiles.
- type: entity
  parent: ChemicalFire
  id: ChemicalFireFrost
  name: frost fire
  components:
  - type: ChemicalFire
    color: "#50D0FF"
    duration: 6
    temperature: 700
    exposedVolume: 25

- type: entity
  parent: ChemicalFire
  id: ChemicalFireThermite
  name: thermite fire
  components:
  - type: ChemicalFire
    color: "#ffc291"
    duration: 7
    temperature: 2900
    heatPower: 12000
    extinguishable: false # thermite burns through a dousing
    # Foam has to win a fight with it: a blanket smothers it at its foam over 6 a second, while the fire boils the
    #     blanket away with 6.5% of its heat (about 0.2u a second, at the 4080 J a unit of foam takes). One full blanket
    #     left alone loses; one kept topped up by spraying wins in about 5 seconds.
    foamSmotherResistance: 6
    foamHeatFraction: 0.065
  - type: SparkOnTrigger
  - type: TriggerOnSpawn
