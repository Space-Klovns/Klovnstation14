- type: entity
  id: BaseChemicalFire
  abstract: true
  name: chemical fire
  description: Get out of it.
  # A chemfire is a transient effect that a system puts on a tile and takes back off it, so there is nothing
  #     to be gained from writing one into a map file - and its TileEmission is added on spawn, which the map
  #     save test rightly objects to on anything that could be saved.
  save: false
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      chemfire:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        hard: false
        # layer:
        # - LowImpassable
        # - MidImpassable
        # mask:
        # - LowImpassable
        # - MidImpassable
        layer:
        - SlipLayer
        mask:
        - ItemMask
  # No Sprite: both flame halves are drawn by the client's chemfire overlays, from the RSI and offset set on
  #     ChemicalFire, so that whatever draws between them (gas, mobs) treats both the same way.
  - type: Tag
    tags:
    - HideContextMenu

  - type: EmitSoundOnSpawn
    sound:
      path: /Audio/_KS14/Effects/fire_puff.ogg
      params:
        volume: -1
        variation: 0.3

  - type: AlwaysHot
  - type: KsDecalOnSpawn # a scorch mark, as a tile fire leaves
  - type: StepTrigger
    requiredTriggeredSpeed: 0
    intersectRatio: 0.1
    blacklist:
      tags:
      - Catwalk
  - type: TileEntityEffect
    effects:
    - !type:Flammable
      multiplier: 1.25
      multiplierOnExisting: 0.75
    - !type:Ignite
