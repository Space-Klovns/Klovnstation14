- type: entity
  id: BaseChemicalFire
  abstract: true
  name: chemical fire
  description: Get out of it.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      chemfire:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        hard: false
        layer:
        - MidImpassable
        mask:
        - MidImpassable
  # The RSI is 32x48 greyscale, so it is offset half a tile up and modulated with the chemfire's colour.
  #     The matching `over` half is drawn above the effects layer by ChemicalFireOverlay.
  - type: Sprite
    sprite: _KS14/Effects/Fire/chemfire.rsi
    drawdepth: Objects
    snapCardinals: true
    offset: 0,0.5
    layers:
    - state: white_under-1
      map: ["enum.ChemicalFireVisualLayers.Under"]
      shader: unshaded
