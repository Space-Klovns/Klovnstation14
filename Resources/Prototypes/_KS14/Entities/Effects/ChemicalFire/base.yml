- type: entity
  id: BaseChemicalFire
  abstract: true
  name: chemical fire
  description: Get out of it.
  # A chemfire is a transient effect that a system puts on a tile and takes back off it, so there is nothing
  #     to be gained from writing one into a map file - and its TileEmission is added on spawn, which the map
  #     save test rightly objects to on anything that could be saved.
  save: false
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      chemfire:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        hard: false
        # layer:
        # - LowImpassable
        # - MidImpassable
        # mask:
        # - LowImpassable
        # - MidImpassable
        layer:
        - SlipLayer
        mask:
        - ItemMask
  # The RSI is 32x48 greyscale, so it is offset quarter a tile up and modulated with the chemfire's colour.
  #     The matching `over` half is drawn above the effects layer by ChemicalFireOverlay.
  - type: Sprite
    sprite: _KS14/Effects/Fire/chemfire.rsi
    drawdepth: Objects
    snapCardinals: true
    offset: 0,0.25
    layers:
    - state: white_under-1
      map: ["enum.ChemicalFireVisualLayers.Under"]
      shader: unshaded
  - type: Tag
    tags:
    - HideContextMenu

  - type: EmitSoundOnSpawn
    sound:
      path: /Audio/_KS14/Effects/fire_puff.ogg
      params:
        volume: -1
        variation: 0.3
