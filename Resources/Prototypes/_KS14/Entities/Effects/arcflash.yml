- type: entity
  parent: BaseLightning
  id: ArcFlashLightningWeak
  name: arc flash
  categories: [ HideSpawnMenu ]
  components:
    - type: Sprite
      sprite: /Textures/Effects/lightning.rsi
      drawdepth: Effects
      layers:
        - state: "blue_lightning"
          shader: unshaded
    - type: Electrified
      requirePower: false
      isArcFlash: true
      shockDamage: 30
    - type: Lightning
      canArc: true
    - type: PointLight
      enabled: true
      color: "#4080FF"
      radius: 3.5
      softness: 1
      autoRot: true
      castShadows: false

- type: entity
  parent: ArcFlashLightningWeak
  id: ArcFlashLightningMedium
  categories: [ HideSpawnMenu ]
  components:
    - type: Electrified
      shockDamage: 55

- type: entity
  parent: ArcFlashLightningWeak
  id: ArcFlashLightningStrong
  categories: [ HideSpawnMenu ]
  components:
    - type: Electrified
      requirePower: false
      isArcFlash: true
      shockDamage: 75
