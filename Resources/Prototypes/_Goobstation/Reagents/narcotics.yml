- type: reagent  # KS14, removed the yowie and pain stuff, added some other things to it. Basically a medicine with a strict OD
  id: Fentanyl
  name: reagent-name-fentanyl
  group: Narcotics
  desc: reagent-desc-fentanyl
  flavor: fentanyl
  physicalDesc: reagent-physical-desc-murky
  color: "#6e697d"
  metabolisms:
    Bloodstream:
      metabolismRate: 0.05
      effects:
      # poison
      - !type:HealthChange # When overdosing
        conditions:
        - !type:ReagentCondition
          reagent: Fentanyl
          min: 5
        damage:
          types:
            Poison: 0.25 # effectively 10 poison/u
            Asphyxiation: 0.75 # more damage, but easier to treat, will rapidly kill in crit probably?
      - !type:HealthChange # More overdose damage
        conditions:
        - !type:ReagentCondition
          reagent: Fentanyl
          min: 5
        probability: 0.05
        damage:
          types:
            Slash: 1 # clawing at your own skin
      # narcotic
      - !type:PopupMessage # the usual hallucinations
        type: Local
        visualType: Medium
        messages: ["fentanyl-effect-lostsomething","fentanyl-effect-skincrawl","fentanyl-effect-fakepresence","fentanyl-effect-rushing","fentanyl-effect-giddy"]
        probability: 0.05
      - !type:PopupMessage # when you're really tripping balls
        conditions:
        - !type:ReagentCondition
          reagent: Fentanyl
          min: 5
        type: Local
        visualType: Medium
        messages: ["fentanyl-effect-skinworms","fentanyl-effect-breathingrazors","fentanyl-effect-lungstight","fentanyl-effect-observed"]
        probability: 0.05
      - !type:MovementSpeedModifier # you didn't think this would improve your abilities right?
        conditions:
        walkSpeedModifier: 0.8
        sprintSpeedModifier: 0.8
      - !type:GenericStatusEffect
        key: Stutter
        component: StutteringAccent
      - !type:Jitter # KS14, added the thingy
        frequency: 5
      - !type:ModifyParalysis # loss of muscle control
        conditions:
        probability: 0.05
        time: 2
      - !type:ModifyParalysis # more severe effects when you are overdosing
        conditions:
        - !type:ReagentCondition
          reagent: Fentanyl
          min: 5
        probability: 0.05
        time: 4
      - !type:GenericStatusEffect # tripping balls, duh
        key: SeeingRainbows
        component: SeeingRainbows
        type: Add
        time: 20
      - !type:Drunk
        boozePower: 10
      - !type:Emote # Now a bunch of emotes
        emote: Scream
        probability: 0.05
      # medicine
      - !type:EvenHealthChange # KS14, made it heal a bit
        conditions:
        - !type:ReagentCondition
          reagent: Fentanyl
          max: 5
        damage:
          Brute: -0.4 # 5u heals 40 brute
          Burn: -0.4 # 5u heals 40 brute
