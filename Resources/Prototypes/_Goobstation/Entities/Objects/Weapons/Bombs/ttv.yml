- type: entity
  parent: BaseItem
  id: TankTransferValve
  name: tank transfer valve
  description: Cuban Pete sends his regards.
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Weapons/Bombs/ttv.rsi
    granularLayersRendering: true
    layers:
    - map: ["left"]
    - map: ["enum.TTVLayers.Valve"]
      state: valve
    - map: ["right"]
      offset: -0.48,0
  - type: Item
    heldPrefix: ttv
    size: Ginormous
  - type: TTV
  - type: UseDelay
    delay: 1
  - type: Explosive
    explosionType: Thermobaric
    maxIntensity: 60
  - type: ItemSlots
    slots:
      left:
        name: Left tank
        whitelist:
          tags:
          - GasTank
      right:
        name: Right tank
        whitelist:
          tags:
          - GasTank
  - type: Appearance

- type: entity
  parent: TankTransferValve
  id: TankTransferValveWearable
  suffix: Wearable
  components:
  - type: Clothing
    slots: BACK
    sprite: _Goobstation/Objects/Weapons/Bombs/ttv.rsi
    equippedPrefix: ttv
    clothingVisuals:
      backpack:
      - map: [ "ttv" ]
        state: ttv-BACKPACK

- type: entity
  parent: TankTransferValve
  id: SanabiTransferValve
  name: sanabi transfer valve
  description: Holy shit...
  components:
  - type: TTV
    spriteOffsets:
      left: 0,0
      right: -0.5,0
      bottom: -0.25,-0.2
      top: -0.25,0.2
  - type: ItemSlots
    slots:
      left:
        name: Left tank
        whitelist:
          tags:
          - GasTank
      right:
        name: Right tank
        whitelist:
          tags:
          - GasTank
      bottom:
        name: Lower tank
        whitelist:
          tags:
          - GasTank
      top:
        name: Upper tank
        whitelist:
          tags:
          - GasTank
