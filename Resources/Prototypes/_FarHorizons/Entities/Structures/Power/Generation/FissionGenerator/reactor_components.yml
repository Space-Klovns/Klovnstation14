- type: entity
  parent: BaseItem
  id: BaseReactorPart
  categories: [ HideSpawnMenu ]
  components:
  - type: ReactorPart
  - type: Sprite
    sprite: _FarHorizons/Structures/Power/Generation/FissionGenerator/reactor_parts.rsi
    state: default_rod
  - type: Item
    size: Huge
  - type: MultiHandedItem
  - type: Tag
    tags:
    - ReactorPart
  - type: GuideHelp
    guides:
    - NuclearReactor
    - Power

# Fuel Rods
- type: entity
  parent: BaseReactorPart
  id: BaseReactorFuelRod
  name: fuel rod
  description: A fuel rod for a nuclear reactor.
  categories: [ HideSpawnMenu ]
  components:
  - type: ReactorPart
    iconStateInserted: "fuel"
    iconStateCap: "fuel_cap"
    neutronCrossSection: 1.0
    thermalCrossSection: 10
    thermalMass: 420000 # specific heat capacity of steel (420 J/KgK) * mass of component (1000Kg)
  - type: Edible # Blame Abby for making them edible
    transferAmount: null
    delay: 30
    forceFeedDelay: 60
  - type: FlavorProfile
    flavors:
    - metal
    - electrons
  - type: BadFood
  - type: SolutionManager
    solutionData:
      food:
        reagents:
        - ReagentId: Uranium
          Quantity: 800
        - ReagentId: Radium
          Quantity: 200
        canReact: false

- type: entity
  parent: BaseReactorFuelRod
  id: CerenkiteReactorFuelRod
  name: cerenkite fuel rod
  components:
  - type: ReactorPart
    material: Cerenkite

- type: entity
  parent: BaseReactorFuelRod
  id: UraniumReactorFuelRod
  name: uranium fuel rod
  components:
  - type: ReactorPart
    material: Uranium

- type: entity
  id: PlutoniumReactorFuelRod
  parent: BaseReactorFuelRod
  name: plutonium fuel rod
  components:
  - type: ReactorPart
    material: Plutonium

- type: entity
  parent: BaseReactorFuelRod
  id: BananiumReactorFuelRod
  name: bananium fuel rod
  description: A honk rod for a nuclear reactor.
  components:
  - type: ReactorPart
    material: Bananium

# Control Rods
- type: entity
  parent: BaseReactorPart
  id: BaseReactorControlRod
  name: control rod
  description: A control rod assembly for a nuclear reactor.
  categories: [ HideSpawnMenu ]
  abstract: true
  components:
  - type: ReactorPart
    rodType: 2 #1<<1
    iconStateInserted: "control"
    iconStateCap: "control_cap"
    isControlRod: true
    neutronCrossSection: 2.0

- type: entity
  parent: BaseReactorControlRod
  id: BohrumReactorControlRod
  name: bohrum control rod
  components:
  - type: ReactorPart
    material: Bohrum

# Gas Channel Rods
- type: entity
  parent: BaseReactorPart
  id: BaseReactorGasChannel
  name: gas channel rod
  description: A gas channel for a nuclear reactor.
  categories: [ HideSpawnMenu ]
  components:
  - type: ReactorPart
    rodType: 4 #1<<2
    iconStateInserted: "gas"
    iconStateCap: "gas_cap"
    thermalCrossSection: 15
    gasVolume: 100
    thermalMass: 21000

- type: entity
  parent: BaseReactorGasChannel
  id: SteelReactorGasChannel
  name: steel gas channel rod
  components:
  - type: ReactorPart
    material: Steel

- type: entity
  parent: BaseReactorGasChannel
  id: BrassReactorGasChannel
  name: brass gas channel rod
  components:
  - type: ReactorPart
    material: Brass

# Heat Exchanger Rods
- type: entity
  parent: BaseReactorPart
  id: BaseReactorHeatExchanger
  name: heat exchanger rod
  description: A heat exchanger for a nuclear reactor.
  categories: [ HideSpawnMenu ]
  components:
  - type: ReactorPart
    iconStateInserted: "heat"
    iconStateCap: "heat_cap"
    neutronCrossSection: 0.1
    thermalCrossSection: 25

- type: entity
  parent: BaseReactorHeatExchanger
  id: SteelReactorHeatExchanger
