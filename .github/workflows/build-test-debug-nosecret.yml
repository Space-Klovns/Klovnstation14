### IMPORTANT: This file should never be copied from onto `build-test-debug.yml`. This file should be considered a derivative of `build-test-debug.yml`.

name: Build & Test Debug (No Secrets)

on:
  push:
    branches: [ master, staging, stable ]
  merge_group:
  pull_request:
    types: [ opened, reopened, synchronize, ready_for_review ]
    branches: [ master, staging, stable ]

permissions:
  actions: write # needed for cancel-action

concurrency: # KS14: a newer commit supersedes a running build on the same branch/pr
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.actor != 'PJBot' && github.event.pull_request.draft == false && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    strategy:
      fail-fast: false # KS14: one red shard must not cancel its siblings
      matrix:
        os: [ubuntu-latest]
        # KS14: integration test shards, sliced with NUnit.Where because VSTest --filter burns ~19 min
        # per job on this suite before any test runs. Shards are balanced by measured execution time,
        # not case count. `rest` is the exact negation of the three positive slices, so the union
        # always covers the whole suite; edit a positive slice and its negation twin together.
        # TSL gotcha: no backslash escapes in the regexes, a `\.` silently matches zero tests.
        shard: [prototypes, maps, rounds, rest]
        include:
          - shard: prototypes
            where: "test =~ 'Tests.Damageable.DamageAllPrototypesTest' or test =~ 'IntegrationTests.Tests.Construction'"
          - shard: maps
            where: "class == 'Content.IntegrationTests.Tests.PostMapInitTest'"
          - shard: rounds
            where: "test =~ 'IntegrationTests.Tests.GameRules.' or test =~ 'IntegrationTests.Tests.EntityTest.'"
          - shard: rest
            where: "test !~ 'Tests.Damageable.DamageAllPrototypesTest' and test !~ 'IntegrationTests.Tests.Construction' and class != 'Content.IntegrationTests.Tests.PostMapInitTest' and test !~ 'IntegrationTests.Tests.GameRules.' and test !~ 'IntegrationTests.Tests.EntityTest.'"

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45 # KS14: bound runaway jobs; keep above the in-process test watchdog so it reports first

    steps:
    - name: Checkout Master
      uses: actions/checkout@v7
      with: # KS14: params
        fetch-depth: 1

    # If we have the secret repo PAT, don't do anything and only init RT. Otherwise quit early; there's no point testing `nosecret` now because we can't; the other workflow for builds will do it instead.
    ### Not done recursively (for no-token run because we update submodules in a later step
    - name: Init submodules (conditional)
      shell: bash
      env:
        HAS_TOKEN: ${{ secrets.SECREPO_PAT != '' }}
      run: |
        set -e

        if [ "$HAS_TOKEN" = "true" ]; then
          echo "Token present → only initing RT"

          git config --global url."https://x-access-token:${{ secrets.SECREPO_PAT }}@github.com/".insteadOf "https://github.com/"

          git submodule sync RobustToolbox
          git submodule update --init RobustToolbox

          echo "EXIT_EARLY=false" >> $GITHUB_ENV
        else
          echo "No token → quit early to let other workflow handle it"
          echo "EXIT_EARLY=true" >> $GITHUB_ENV
        fi

    - name: Cancel early if condition met
      if: ${{ env.EXIT_EARLY == 'true' }}
      uses: space-klovns/cancel-action@v0.0  # Cancels the run gracefully
    # KS14 End

    - name: Pull engine updates
      uses: space-wizards/submodule-dependency@v0.1.5

    - name: Update Engine Submodules
      run: |
        cd RobustToolbox/
        git submodule update --init --recursive

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Install dependencies
      run: dotnet restore

    # SURELY WONT HAUNT US IN THE FUTURE
    - name: Build Project
      run: > # KS14: changed params to make it faster or something by alot
        dotnet build
        --configuration DebugOpt
        --no-restore
        -m
        -p:DebugType=None
        -p:DebugSymbols=false
        -p:RunAnalyzers=false
        -p:EnableNETAnalyzers=false
        -p:BuildInParallel=true
        -p:CL_MPCount=3

    - name: Run Content.Tests
      if: ${{ matrix.shard == 'maps' }} # KS14: run once, on the shortest shard
      shell: pwsh # KS14: add NUnit.ConsoleOut=0, NUnit.InternalTraceLevel=Off; to minimise XML OOM disaster
      run: >
        dotnet test
        --no-build
        --configuration DebugOpt
        Content.Tests/Content.Tests.csproj
        -- NUnit.ConsoleOut=0

    - name: Run Content.IntegrationTests (${{ matrix.shard }})
      shell: pwsh # KS14: Rework command to add `ConsoleOut=0`, `InternalTraceLevel=Off`, `TestOutputXml=`, `--logger "console;verbosity=minimal"` to minimise XML disaster
      run: |
        $env:DOTNET_gcServer=1

        dotnet test `
          --no-build `
          --configuration DebugOpt `
          Content.IntegrationTests/Content.IntegrationTests.csproj `
          --logger "console;verbosity=minimal" `
          -- `
          RunConfiguration.TreatNoTestsAsError=true `
          NUnit.ConsoleOut=0 `
          NUnit.InternalTraceLevel=Off `
          NUnit.MapWarningTo=Failed `
          NUnit.TestOutputXml= `
          NUnit.NumberOfTestWorkers=1 `
          NUnit.AssemblySelectLimit=100000 `
          "NUnit.Where=${{ matrix.where }}"

    # KS14: Removed test result archival
  ci-success:
    name: Build & Test Debug
    if: always() # KS14: else a red build leaves this check "skipped", which branch protection counts as passing
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
      - name: CI succeeded
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        run: exit 0
      - name: CI failed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
