name: Build & Test Debug (No Secrets)

on:
  push:
    branches: [ master, staging, stable ]
  merge_group:
  pull_request:
    types: [ opened, reopened, synchronize, ready_for_review ]
    branches: [ master, staging, stable ]

jobs:
  build:
    if: github.actor != 'PJBot' && github.event.pull_request.draft == false
    strategy:
      matrix:
        os: [ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout Master
      uses: actions/checkout@v7
      with: # KS14: params
        fetch-depth: 1

    # If we have the secret repo PAT, don't do anything and only init RT. Otherwise quit early; there's no point testing `nosecret` now because we can't; the other workflow for builds will do it instead.
    ### Not done recursively (for no-token run because we update submodules in a later step
    - name: Init submodules (conditional)
      shell: bash
      env:
        HAS_TOKEN: ${{ secrets.SECREPO_PAT != '' }}
      run: |
        set -e

        if [ "$HAS_TOKEN" = "true" ]; then
          echo "Token present → only initing RT"

          git config --global url."https://x-access-token:${{ secrets.SECREPO_PAT }}@github.com/".insteadOf "https://github.com/"

          git submodule sync RobustToolbox
          git submodule update --init RobustToolbox
        else
          echo "No token → quit early to let other workflow handle it"
          quit 0
        fi
    # KS14 End

    - name: Pull engine updates
      uses: space-wizards/submodule-dependency@v0.1.5

    - name: Update Engine Submodules
      run: |
        cd RobustToolbox/
        git submodule update --init --recursive

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Install dependencies
      run: dotnet restore

    # SURELY WONT HAUNT US IN THE FUTURE
    - name: Build Project
      run: > # KS14: changed params to make it faster or something by alot
        dotnet build
        --configuration DebugOpt
        --no-restore
        -m
        -p:DebugType=None
        -p:DebugSymbols=false
        -p:RunAnalyzers=false
        -p:EnableNETAnalyzers=false
        -p:BuildInParallel=true
        -p:CL_MPCount=3

    - name: Run Content.Tests
      shell: pwsh # KS14: add NUnit.ConsoleOut=0, NUnit.InternalTraceLevel=Off; to minimise XML OOM disaster
      run: >
        dotnet test
        --no-build
        --configuration DebugOpt
        Content.Tests/Content.Tests.csproj
        -- NUnit.ConsoleOut=0

    - name: Run Content.IntegrationTests
      shell: pwsh # KS14: Rework command to add `ConsoleOut=0`, `InternalTraceLevel=Off`, `TestOutputXml=`, `--logger "console;verbosity=minimal"` to minimise XML disaster
      # KS14: Added heap hardlimit
      run: |
        $env:DOTNET_gcServer=1

        dotnet test `
          --no-build `
          --configuration DebugOpt `
          Content.IntegrationTests/Content.IntegrationTests.csproj `
          --logger "console;verbosity=minimal" `
          -- `
          NUnit.ConsoleOut=0 `
          NUnit.InternalTraceLevel=Off `
          NUnit.MapWarningTo=Failed `
          NUnit.TestOutputXml= `
          NUnit.NumberOfTestWorkers=1

    # KS14: Removed test result archival
  ci-success:
    name: Build & Test Debug
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
      - name: CI succeeded
        run: exit 0
